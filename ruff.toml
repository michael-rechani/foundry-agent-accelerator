target-version = "py314"

[lint]
# E9/F: syntax and undefined names. B: likely bugs. ASYNC: blocking calls in async code.
# S: Bandit security checks; tests use fixed fake secrets, seeded randomness, and subprocesses.
select = ["E9", "F", "B", "ASYNC", "S"]

[lint.per-file-ignores]
"**/test_*.py" = ["S"]
