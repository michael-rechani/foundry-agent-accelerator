<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">One foundation. Repeatable agent releases.</title>
  <desc id="desc">Two connected workflows. The Private foundation lane uses Terraform and Azure Verified Modules: step 1 reviews the plan for permissions, quota, cost approval, and protected remote state; step 2 provisions separate Foundry platform and Lab roots with optional Bastion and monitoring; step 3 verifies private access, network paths, identities, and the intended environment. A data handoff passes the project endpoint, model deployments, identity, and private connectivity to agent releases; a bundle does not carry Azure permissions, infrastructure, or saved records. The Agent releases lane uses reviewed code, instructions, and versioned configuration: step 4 packages source and a configuration manifest while keeping deployment mappings explicit; step 5 publishes a new hosted version and checks the documented release gates; step 6 routes, reviews, and iterates by checking answers against evidence and using guarded recovery. People approve infrastructure changes, publication costs, and business decisions. This is a logical workflow only; the CLI and Lab release paths have different gates, and a code push is not a deployment.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4aa8ff"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3cc3ae"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #e6edf3; }
      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #a9b4c0; }
      .heading { font-size: 24px; font-weight: 600; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 20px; }
      .detail { font-size: 18px; }
      .small { font-size: 18px; fill: #a9b4c0; }
      .pe { font-size: 18px; font-weight: 600; fill: #b8c9da; }
      .mono { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; font-weight: 600; fill: #b8c9da; }
      .cidr { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; fill: #a9b4c0; }
      .label { font-size: 18px; fill: #a9b4c0; font-weight: 600; }
      .boundary { font-size: 18px; font-weight: 600; fill: #a9b4c0; letter-spacing: 0.4px; }
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #1f252e; }
      .request { fill: none; stroke: #4aa8ff; stroke-width: 2.5; marker-end: url(#blue); }
      .result { fill: none; stroke: #3cc3ae; stroke-width: 2.5; marker-end: url(#teal); }
      .data { fill: none; stroke: #3cc3ae; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#teal); }
      .bus { fill: none; stroke: #3cc3ae; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .line { fill: none; stroke: #4aa8ff; stroke-width: 2.5; }
      .link { fill: none; stroke: #6b7c8e; stroke-width: 2; }
    </style>
