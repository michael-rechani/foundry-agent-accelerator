<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1060" viewBox="0 0 760 1060" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Operate and protect the Lab</title>
  <desc id="desc">Three separate operational paths, not a sequential workflow or network map. The bounded Lab runtime sends request metadata, not prompts, to private Log Analytics through Azure Monitor. Delivered notifications require an action group. An approved private runner uses Linux Docker to publish the Lab image to a private Azure Container Registry; the Lab is deployed by image digest. Registry admin authentication is disabled. Terraform uses authorized private access and Entra authentication for separate platform and Lab state keys in an existing Azure Blob backend. State requires locking, protected versions, and backups. Necessary secrets belong in Azure Key Vault; prefer managed identity for service access. These are default configuration and operating requirements, not proof of a live deployment.</desc>
  <defs>
    <marker id="operation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 30px; font-weight: 600; }
      .heading { font-size: 25px; font-weight: 600; }
      .body { font-size: 22px; }
      .detail { font-size: 20px; }
      .label { font-size: 20px; fill: #4d5b69; }
      .operation { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#operation-arrow); }
      .state { fill: none; stroke: #00786a; stroke-width: 2.5; marker-end: url(#state-arrow); }
    </style>
  </defs>

  <rect width="760" height="1060" fill="#fff"/>
  <text x="24" y="42" class="title">Operate and protect the Lab</text>
  <text x="24" y="74" class="detail">Separate paths for telemetry, image publishing, and state</text>

  <g id="telemetry-path">
    <rect x="24" y="106" width="712" height="250" rx="16" fill="#f5f7fa" stroke="#cdd9e2"/>
    <text x="48" y="142" class="heading">Observe the runtime</text>
    <g id="lab-runtime">
      <rect x="48" y="166" width="248" height="144" rx="12" fill="#fff" stroke="#8da6bb" stroke-width="1.5"/>
      <text x="70" y="201" class="heading">Lab runtime</text>
      <text x="70" y="233" class="detail">Limits and deadlines</text>
      <text x="70" y="264" class="detail">Cached health probes</text>
      <text x="70" y="294" class="detail">One worker, one replica</text>
    </g>
    <g id="private-logs">
      <rect x="400" y="166" width="312" height="144" rx="12" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
      <text x="422" y="201" class="heading">Azure Monitor</text>
      <text x="422" y="233" class="body">Log Analytics</text>
      <text x="422" y="264" class="detail">Private ingestion + queries</text>
      <text x="422" y="294" class="detail">Local keys disabled</text>
    </g>
    <path d="M296 240H400" class="operation"/>
    <text x="348" y="220" text-anchor="middle" class="label">Metadata</text>
    <text x="48" y="341" class="detail">No prompt logging. Notifications need an action group.</text>
  </g>

  <g id="image-path">
    <rect x="24" y="376" width="712" height="250" rx="16" fill="#f5f7fa" stroke="#cdd9e2"/>
    <text x="48" y="412" class="heading">Build and publish the Lab</text>
    <g id="private-runner">
      <rect x="48" y="440" width="248" height="144" rx="12" fill="#fff" stroke="#8da6bb" stroke-width="1.5"/>
      <text x="70" y="475" class="heading">Build runner</text>
      <text x="70" y="507" class="detail">Private access</text>
      <text x="70" y="537" class="detail">Linux Docker engine</text>
      <text x="70" y="567" class="detail">Approved identity</text>
    </g>
    <g id="private-registry">
      <rect x="400" y="440" width="312" height="144" rx="12" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
      <text x="422" y="475" class="heading">Azure Container</text>
      <text x="422" y="507" class="body">Registry</text>
      <text x="422" y="537" class="detail">Private endpoint only</text>
      <text x="422" y="567" class="detail">Registry admin disabled</text>
    </g>
    <path d="M296 514H400" class="operation"/>
    <text x="348" y="494" text-anchor="middle" class="label">Push</text>
    <text x="48" y="613" class="detail">The Lab pulls the approved image by digest, using scoped access.</text>
  </g>

  <g id="state-path">
    <rect x="24" y="646" width="712" height="250" rx="16" fill="#f5f7fa" stroke="#cdd9e2"/>
    <text x="48" y="682" class="heading">Protect deployment state</text>
    <g id="terraform-client">
      <rect x="48" y="710" width="248" height="144" rx="12" fill="#fff" stroke="#8da6bb" stroke-width="1.5"/>
      <text x="70" y="745" class="heading">Terraform</text>
      <text x="70" y="777" class="detail">Private access</text>
      <text x="70" y="807" class="detail">Entra authentication</text>
      <text x="70" y="837" class="detail">Keyless resource reads</text>
    </g>
    <g id="state-storage">
      <rect x="400" y="710" width="312" height="144" rx="12" fill="#edf7f4" stroke="#00786a" stroke-width="1.5"/>
      <image href="data:image/svg+xml;base64," x="422" y="728" width="36" height="36"/>
      <text x="470" y="754" class="heading">Azure Blob Storage</text>
      <text x="422" y="791" class="detail">Platform and Lab state keys</text>
      <text x="422" y="823" class="detail">Locking + protected versions</text>
    </g>
    <path d="M296 784H400" class="state"/>
    <text x="348" y="764" text-anchor="middle" class="label">State I/O</text>
    <text x="48" y="883" class="detail">Use private Blob access; preserve state and protected backups.</text>
  </g>

  <g id="credential-boundary">
    <rect x="24" y="916" width="712" height="118" rx="12" fill="#fffaf0" stroke="#b59e59" stroke-width="1.5"/>
    <image href="data:image/svg+xml;base64," x="48" y="938" width="40" height="40"/>
    <text x="108" y="957" class="heading">Azure Key Vault: necessary secrets</text>
    <text x="108" y="989" class="detail">Prefer managed identity for service access.</text>
    <text x="108" y="1019" class="detail">State and backups still need their own protection.</text>
  </g>
</svg>