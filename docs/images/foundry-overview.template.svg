<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1070" viewBox="0 0 760 1070" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Lab infrastructure at a glance</title>
  <desc id="desc">Default logical runtime paths. A browser on an approved private network, such as the jumpbox reached through Azure Bastion, reaches the Lab's React and FastAPI application in an internal Azure Container Apps environment. The backend uses managed identity to call named agents in Foundry Agent Service and, separately, to read and write application records, including saved chats, reviews, and created agents, in Cosmos DB. Both managed services are reached through private endpoints; they are not placed inside the Container Apps environment. Chat saves are explicit. Document review drafts and results are persisted by the server. API Management is optional, disabled by default, and outside these paths. The Lab has shared records and no end-user sign-in or per-user authorization. This is not a live resource inventory.</desc>
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="record-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 30px; font-weight: 600; }
      .heading { font-size: 25px; font-weight: 600; }
      .body { font-size: 22px; }
      .detail { font-size: 20px; }
      .label { font-size: 20px; fill: #4d5b69; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#request-arrow); }
      .record { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#record-arrow); }
    </style>
  </defs>

  <rect width="760" height="1070" fill="#fff"/>
  <text x="24" y="42" class="title">Lab infrastructure at a glance</text>
  <text x="24" y="74" class="detail">Default request paths and application-owned data</text>

  <g id="private-browser">
    <rect x="120" y="104" width="520" height="126" rx="12" fill="#f5f7fa" stroke="#aebdcb" stroke-width="1.5"/>
    <text x="146" y="141" class="heading">Browser on an approved network</text>
    <text x="146" y="175" class="detail">Private HTTPS; no Azure keys in the browser</text>
    <text x="146" y="205" class="detail">For example, the jumpbox via Azure Bastion</text>
  </g>
  <path d="M380 230V282" class="request"/>
  <text x="402" y="264" class="label">Private app access</text>

  <g id="lab-backend">
    <rect x="120" y="282" width="520" height="152" rx="12" fill="#fff" stroke="#0078d4" stroke-width="2"/>
    <text x="146" y="320" class="heading">The Lab</text>
    <text x="146" y="353" class="body">React + FastAPI in Azure Container Apps</text>
    <text x="146" y="384" class="detail">Internal environment; controlled private access</text>
    <text x="146" y="413" class="detail">Managed identity for Azure service calls</text>
  </g>
  <path d="M204 434V522" class="request"/>
  <path d="M556 434V522" class="record"/>
  <text x="236" y="493" class="label">Agent calls</text>
  <text x="428" y="493" class="label">Records</text>

  <g id="foundry-service">
    <rect x="48" y="522" width="312" height="182" rx="12" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
    <image href="azure-icons/agent-service.svg" x="70" y="540" width="36" height="36"/>
    <text x="120" y="561" class="heading">Foundry</text>
    <text x="120" y="591" class="body">Agent Service</text>
    <text x="70" y="624" class="detail">Coordinator + specialists</text>
    <text x="70" y="654" class="detail">Uses the configured model</text>
    <text x="70" y="684" class="detail">Private endpoint</text>
  </g>
  <g id="application-records">
    <rect x="400" y="522" width="312" height="182" rx="12" fill="#edf7f4" stroke="#00786a" stroke-width="1.5"/>
    <image href="azure-icons/cosmos-db.svg" x="422" y="540" width="36" height="36"/>
    <text x="470" y="561" class="heading">Azure Cosmos DB</text>
    <text x="470" y="591" class="body">Application data</text>
    <text x="422" y="624" class="detail">Saved chats, reviews,</text>
    <text x="422" y="654" class="detail">and created agents</text>
    <text x="422" y="684" class="detail">Private endpoint</text>
  </g>

  <g id="persistence-note">
    <rect x="48" y="732" width="664" height="88" rx="12" fill="#f5f7fa" stroke="#cdd9e2"/>
    <text x="70" y="765" class="detail">Chat is saved only when requested.</text>
    <text x="70" y="796" class="detail">Document review drafts and results are saved by the server.</text>
  </g>

  <g id="optional-apim">
    <rect x="24" y="844" width="712" height="100" rx="12" fill="#fffaf0" stroke="#b59e59" stroke-width="1.5" stroke-dasharray="7 5"/>
    <image href="azure-icons/api-management.svg" x="48" y="864" width="40" height="40"/>
    <text x="108" y="882" class="heading">Optional: Azure API Management</text>
    <text x="108" y="917" class="detail">Not deployed by default; the Lab does not need it.</text>
  </g>

  <g id="shared-data-warning">
    <rect x="24" y="968" width="712" height="74" rx="8" fill="#fff4ce"/>
    <text x="48" y="998" class="detail">Fictional data only. There is no end-user sign-in.</text>
    <text x="48" y="1028" class="detail">Saved records are shared, without per-user authorization.</text>
  </g>
</svg>