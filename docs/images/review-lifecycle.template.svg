<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">How a document review runs</title>
  <desc id="desc">How a document review runs, in eight numbered steps. Everything is saved before anything runs. Step 1, create a draft: you add a checklist and documents, the Lab checks them and saves a draft, and no model is called yet. Step 2, start the review: you choose Run review, which uses one of the review's four runs. The Lab refuses to start if the review has changed or another start is already under way. Step 3, save a snapshot: the Lab saves exactly what will be reviewed in Azure Cosmos DB, confirms the review has started, and keeps going if you close the browser. Then the work is run, checked, and saved. Step 4: a coordinator and specialists in Microsoft Foundry Agent Service read all the documents and details, signing in with a managed identity, for up to three minutes. Step 5, check the answer: the Lab confirms that the specialists really ran, that every checklist item has an answer, and that every quote matches its source exactly. If a check fails, the answer is not kept. Step 6, save the result: the Lab saves the findings, or the reason the review failed. Only the Lab sets the status, never the model's text. Azure Cosmos DB keeps drafts, saved snapshots, and the results of every run for 30 days, and never overwrites newer edits. A review can end up as Results saved, Needs information, Failed, or Interrupted. Opening or refreshing a review never starts a new run. What you can do next: for a review that needs information, step 7 lets you add the missing details or say which statement is right, then review again from step 2. For an interrupted review, step 8 lets you recover it after you confirm that it may cost more, and it runs again from step 2 using the saved input. Earlier inputs stay unchanged. Recovering reruns the saved input, so it may be charged again. The Lab runs reviews itself, with one worker, one copy, no job queue, and no automatic retry.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
