      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #4d5b69; }
      .heading { font-size: 24px; font-weight: 600; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 20px; }
      .detail { font-size: 18px; }
      .small { font-size: 18px; fill: #4d5b69; }
      .pe { font-size: 18px; font-weight: 600; fill: #334e68; }
      .mono { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; font-weight: 600; fill: #334e68; }
      .cidr { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; fill: #4d5b69; }
      .label { font-size: 18px; fill: #4d5b69; font-weight: 600; }
      .boundary { font-size: 18px; font-weight: 600; fill: #4d5b69; letter-spacing: 0.4px; }
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#blue); }
      .result { fill: none; stroke: #00786a; stroke-width: 2.5; marker-end: url(#teal); }
      .data { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#teal); }
      .bus { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .line { fill: none; stroke: #0078d4; stroke-width: 2.5; }
      .link { fill: none; stroke: #8da6bb; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#fff"/>
  <text x="24" y="50" class="title">Document review lifecycle</text>
  <text x="24" y="86" class="sub">Each review is saved before it runs and checked before its result is saved. Numbers follow one review run.</text>
  <rect x="1280" y="160" width="296" height="372" rx="12" fill="#edf7f4" stroke="#00786a" stroke-width="1.5"/>
  <image href="azure-icons/cosmos-db.svg" x="1294" y="174" width="36" height="36"/>
  <text x="1340" y="198" class="name">Azure Cosmos DB</text>
  <text x="1340" y="222" class="small">Review records</text>
  <text x="1300" y="254" class="detail">Drafts, snapshots, results</text>
  <text x="1300" y="282" class="detail">Conditional writes with ETags</text>
  <text x="1300" y="310" class="detail">30-day TTL records</text>
  <rect x="24" y="122" width="1080" height="260" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="153" class="boundary">SAVE BEFORE RUNNING</text>
  <rect x="48" y="184" width="300" height="160" rx="10" fill="#fff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="64" y="220" class="name">Create draft</text>
  <circle cx="320" cy="212" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="320" y="218" class="num" text-anchor="middle">1</text>
  <text x="64" y="250" class="mono">POST /api/review-runs</text>
  <text x="64" y="275" class="detail">Validate criteria + sources</text>
  <text x="64" y="300" class="detail">Server fields + ETag</text>
  <text x="64" y="325" class="detail">No model call</text>
  <rect x="416" y="184" width="300" height="160" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="432" y="220" class="name">Start run</text>
  <circle cx="688" cy="212" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="688" y="218" class="num" text-anchor="middle">2</text>
  <text x="432" y="250" class="mono">POST …/execute</text>
  <text x="432" y="275" class="mono">If-Match</text>
  <text x="432" y="300" class="detail">Uses one of four runs</text>
  <text x="432" y="325" class="detail">409 if stale/competing</text>
  <rect x="784" y="184" width="300" height="160" rx="10" fill="#fff" stroke="#00786a" stroke-width="2"/>
  <text x="800" y="220" class="name">Save running snapshot</text>
  <circle cx="1056" cy="212" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="1056" y="218" class="num" text-anchor="middle">3</text>
  <text x="800" y="250" class="detail">Conditional Cosmos write</text>
  <text x="800" y="275" class="detail">Saves input snapshot</text>
  <text x="800" y="300" class="detail">Returns HTTP 202</text>
  <path d="M348 264H408" class="request"/>
  <path d="M716 264H776" class="request"/>
  <path d="M1084 264H1272" class="data"/>
  <rect x="24" y="386" width="1080" height="226" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="417" class="boundary">RUN, CHECK, THEN SAVE</text>
  <path d="M934 344V368H330V440" class="request"/>
  <rect x="48" y="448" width="340" height="130" rx="10" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
  <image href="azure-icons/agent-service.svg" x="62" y="464" width="36" height="36"/>
  <text x="108" y="484" class="name">Foundry Agent Service</text>
  <circle cx="360" cy="476" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="360" y="482" class="num" text-anchor="middle">4</text>
  <text x="64" y="514" class="detail">Coordinator + specialists</text>
  <text x="64" y="539" class="detail">Schema + accumulated evidence</text>
  <text x="64" y="564" class="detail">Managed identity; up to 180 s</text>
  <rect x="440" y="448" width="310" height="130" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="456" y="484" class="name">Fail-closed checks</text>
  <circle cx="722" cy="476" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="722" y="482" class="num" text-anchor="middle">5</text>
  <text x="456" y="514" class="detail">Verified specialist receipts</text>
  <text x="456" y="539" class="detail">JSON schema + coverage</text>
  <text x="456" y="564" class="detail">Exact source quotes</text>
  <rect x="812" y="448" width="272" height="130" rx="10" fill="#fff" stroke="#00786a" stroke-width="2"/>
  <text x="828" y="484" class="name">Final write</text>
  <circle cx="1056" cy="476" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="1056" y="482" class="num" text-anchor="middle">6</text>
  <text x="828" y="514" class="detail">Findings or failure code</text>
  <text x="828" y="539" class="detail">Uses the run's ETag</text>
  <text x="828" y="564" class="detail">Model text cannot set status</text>
  <path d="M388 513H432" class="request"/>
  <path d="M750 513H804" class="request"/>
  <path d="M1084 513H1272" class="data"/>
  <rect x="24" y="638" width="1080" height="148" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="669" class="boundary">WHAT THE INBOX SHOWS</text>
  <rect x="48" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="64" y="722" class="mono">completed</text>
  <text x="64" y="748" class="detail">Findings saved</text>
  <rect x="310" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="326" y="722" class="mono">waiting_input</text>
  <text x="326" y="748" class="detail">Questions saved</text>
  <rect x="580" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="596" y="722" class="mono">failed</text>
  <text x="596" y="748" class="detail">Failure saved; no retry</text>
  <rect x="830" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="846" y="722" class="mono">interrupted</text>
  <text x="846" y="748" class="detail">Recover explicitly</text>
  <rect x="24" y="812" width="1080" height="204" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="843" class="boundary">FOLLOW-UP ACTIONS</text>
  <rect x="280" y="860" width="280" height="132" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
