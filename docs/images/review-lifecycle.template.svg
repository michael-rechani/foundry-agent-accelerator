  <circle cx="532" cy="888" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="532" y="894" class="num" text-anchor="middle">7</text>
  <text x="296" y="926" class="mono">POST …/evidence</text>
  <text x="296" y="951" class="detail">If-Match</text>
  <text x="296" y="976" class="detail">Starts a new run from step 2</text>
  <rect x="800" y="860" width="280" height="132" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="816" y="896" class="name">Recover</text>
  <circle cx="1052" cy="888" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="1052" y="894" class="num" text-anchor="middle">8</text>
  <text x="816" y="926" class="mono">POST …/resume</text>
  <text x="816" y="951" class="detail">confirm_cost: true</text>
  <text x="816" y="976" class="detail">Starts a new run from step 2</text>
  <path d="M420 762V852" class="request"/>
  <path d="M940 762V852" class="request"/>
  <rect x="1296" y="426" width="264" height="82" rx="8" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="1312" y="456" class="detail">Reading or refreshing</text>
  <text x="1312" y="481" class="detail">never starts an agent call.</text>
  <rect x="1280" y="820" width="296" height="112" rx="8" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="1296" y="850" class="detail">Runs inside the Lab process:</text>
  <text x="1296" y="875" class="detail">one worker, one replica,</text>
  <text x="1296" y="900" class="detail">no queue or automatic retry.</text>
  <text x="24" y="1064" class="boundary">LEGEND</text>
  <path d="M120 1058H176" class="request"/>
  <text x="186" y="1064" class="small">Request</text>
  <path d="M287 1058H343" class="data"/>
  <text x="353" y="1064" class="small">Data read or write</text>
  <circle cx="544" cy="1058" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="544" y="1064" class="num" text-anchor="middle">n</text>
  <text x="570" y="1064" class="small">Step</text>
  <circle cx="658" cy="1058" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="658" y="1064" class="num" text-anchor="middle">n</text>
  <text x="684" y="1064" class="small">Data step</text>
  <rect x="796" y="1044" width="44" height="28" rx="6" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="850" y="1064" class="small">Caveat</text>
  <text x="1576" y="1064" class="small" text-anchor="end">Recovery reruns saved input; it is not exactly-once.</text>
</svg>
