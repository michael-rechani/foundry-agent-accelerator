      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #4d5b69; }
      .heading { font-size: 24px; font-weight: 600; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 20px; }
      .detail { font-size: 18px; }
      .small { font-size: 18px; fill: #4d5b69; }
      .pe { font-size: 18px; font-weight: 600; fill: #334e68; }
      .mono { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; font-weight: 600; fill: #334e68; }
      .cidr { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; fill: #4d5b69; }
      .label { font-size: 18px; fill: #4d5b69; font-weight: 600; }
      .boundary { font-size: 18px; font-weight: 600; fill: #4d5b69; letter-spacing: 0.4px; }
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#blue); }
      .result { fill: none; stroke: #00786a; stroke-width: 2.5; marker-end: url(#teal); }
      .data { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#teal); }
      .bus { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .line { fill: none; stroke: #0078d4; stroke-width: 2.5; }
      .link { fill: none; stroke: #8da6bb; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#fff"/>
  <text x="24" y="50" class="title">How a document review runs</text>
  <text x="24" y="86" class="sub">Your work is saved before the review runs, and the answer is checked before it is kept. Numbers follow one review.</text>
  <rect x="1280" y="160" width="296" height="372" rx="12" fill="#edf7f4" stroke="#00786a" stroke-width="1.5"/>
  <image href="azure-icons/cosmos-db.svg" x="1294" y="174" width="36" height="36"/>
  <text x="1340" y="198" class="name">Azure Cosmos DB</text>
  <text x="1340" y="222" class="small">Review records</text>
  <text x="1300" y="254" class="detail">Drafts and saved snapshots</text>
  <text x="1300" y="282" class="detail">Results of every run</text>
  <text x="1300" y="310" class="detail">Never overwrites newer edits</text>
  <text x="1300" y="338" class="detail">Kept for 30 days</text>
  <rect x="24" y="122" width="1080" height="260" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="153" class="boundary">SAVED BEFORE ANYTHING RUNS</text>
  <rect x="48" y="184" width="300" height="160" rx="10" fill="#fff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="64" y="220" class="name">Create a draft</text>
  <circle cx="320" cy="212" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="320" y="218" class="num" text-anchor="middle">1</text>
  <text x="64" y="250" class="detail">You add a checklist and</text>
  <text x="64" y="275" class="detail">documents. The Lab checks</text>
  <text x="64" y="300" class="detail">them and saves a draft.</text>
  <text x="64" y="325" class="detail">No model is called yet.</text>
  <rect x="416" y="184" width="300" height="160" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="432" y="220" class="name">Start the review</text>
  <circle cx="688" cy="212" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="688" y="218" class="num" text-anchor="middle">2</text>
  <text x="432" y="250" class="detail">You choose Run review.</text>
  <text x="432" y="275" class="detail">Uses one of four runs.</text>
  <text x="432" y="300" class="detail">Refused if the review has</text>
  <text x="432" y="325" class="detail">changed or already started.</text>
  <rect x="784" y="184" width="300" height="160" rx="10" fill="#fff" stroke="#00786a" stroke-width="2"/>
  <text x="800" y="220" class="name">Save a snapshot</text>
  <circle cx="1056" cy="212" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="1056" y="218" class="num" text-anchor="middle">3</text>
  <text x="800" y="250" class="detail">Saves exactly what will be</text>
  <text x="800" y="275" class="detail">reviewed, then confirms it</text>
  <text x="800" y="300" class="detail">has started. It keeps going</text>
  <text x="800" y="325" class="detail">if you close the browser.</text>
  <path d="M348 264H408" class="request"/>
  <path d="M716 264H776" class="request"/>
  <path d="M1084 264H1272" class="data"/>
  <rect x="24" y="386" width="1080" height="226" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="417" class="boundary">RUN, CHECK, THEN SAVE</text>
  <path d="M934 344V368H330V440" class="request"/>
  <rect x="48" y="448" width="340" height="130" rx="10" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
  <image href="azure-icons/agent-service.svg" x="62" y="464" width="36" height="36"/>
  <text x="108" y="484" class="name">Foundry Agent Service</text>
  <circle cx="360" cy="476" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="360" y="482" class="num" text-anchor="middle">4</text>
  <text x="64" y="514" class="detail">A coordinator and specialists</text>
  <text x="64" y="539" class="detail">read all your documents and</text>
  <text x="64" y="564" class="detail">details, for up to 3 minutes</text>
  <rect x="440" y="448" width="310" height="130" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="456" y="484" class="name">Check the answer</text>
  <circle cx="722" cy="476" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="722" y="482" class="num" text-anchor="middle">5</text>
  <text x="456" y="514" class="detail">Specialists really did run</text>
  <text x="456" y="539" class="detail">Every item has an answer</text>
  <text x="456" y="564" class="detail">Quotes match sources exactly</text>
  <rect x="812" y="448" width="272" height="130" rx="10" fill="#fff" stroke="#00786a" stroke-width="2"/>
  <text x="828" y="484" class="name">Save the result</text>
  <circle cx="1056" cy="476" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="1056" y="482" class="num" text-anchor="middle">6</text>
  <text x="828" y="514" class="detail">Saves the findings, or</text>
  <text x="828" y="539" class="detail">the reason it failed.</text>
  <text x="828" y="564" class="detail">Only the Lab sets status.</text>
  <path d="M388 513H432" class="request"/>
  <path d="M750 513H804" class="request"/>
  <path d="M1084 513H1272" class="data"/>
  <rect x="24" y="638" width="1080" height="148" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="669" class="boundary">WHERE A REVIEW CAN END UP</text>
  <rect x="48" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="64" y="722" class="pe">Results saved</text>
  <text x="64" y="748" class="detail">Findings are ready</text>
  <rect x="310" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="326" y="722" class="pe">Needs information</text>
  <text x="326" y="748" class="detail">Questions for you</text>
  <rect x="580" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="596" y="722" class="pe">Failed</text>
  <text x="596" y="748" class="detail">Reason saved, no retry</text>
  <rect x="830" y="692" width="220" height="70" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="846" y="722" class="pe">Interrupted</text>
  <text x="846" y="748" class="detail">You can recover it</text>
  <rect x="24" y="812" width="1080" height="204" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="843" class="boundary">WHAT YOU CAN DO NEXT</text>
  <rect x="280" y="860" width="280" height="132" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="296" y="896" class="name">Add what's missing</text>
  <circle cx="532" cy="888" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="532" y="894" class="num" text-anchor="middle">7</text>
  <text x="296" y="926" class="detail">Add the missing details, or</text>
  <text x="296" y="951" class="detail">say which statement is right.</text>
  <text x="296" y="976" class="detail">Then review again (step 2).</text>
  <rect x="800" y="860" width="280" height="132" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="816" y="896" class="name">Recover the review</text>
  <circle cx="1052" cy="888" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="1052" y="894" class="num" text-anchor="middle">8</text>
  <text x="816" y="926" class="detail">Confirm that it may cost</text>
  <text x="816" y="951" class="detail">more, and it runs again</text>
  <text x="816" y="976" class="detail">from the saved input.</text>
  <path d="M420 762V852" class="request"/>
  <path d="M940 762V852" class="request"/>
  <rect x="1296" y="426" width="264" height="82" rx="8" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="1312" y="456" class="detail">Opening or refreshing</text>
  <text x="1312" y="481" class="detail">never starts a new run.</text>
  <rect x="1280" y="820" width="296" height="112" rx="8" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="1296" y="850" class="detail">The Lab runs reviews itself:</text>
  <text x="1296" y="875" class="detail">one worker, one copy, no</text>
  <text x="1296" y="900" class="detail">job queue or automatic retry.</text>
  <text x="24" y="1064" class="boundary">LEGEND</text>
  <path d="M120 1058H176" class="request"/>
  <text x="186" y="1064" class="small">Request</text>
  <path d="M287 1058H343" class="data"/>
  <text x="353" y="1064" class="small">Data saved</text>
  <circle cx="544" cy="1058" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="544" y="1064" class="num" text-anchor="middle">n</text>
  <text x="570" y="1064" class="small">Step</text>
  <circle cx="658" cy="1058" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="658" y="1064" class="num" text-anchor="middle">n</text>
  <text x="684" y="1064" class="small">Save step</text>
  <rect x="796" y="1044" width="44" height="28" rx="6" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="850" y="1064" class="small">Caveat</text>
  <text x="1576" y="1064" class="small" text-anchor="end">Recovering reruns the saved input, so it may be charged again.</text>
</svg>
