<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Document review lifecycle</title>
  <desc id="desc">Document review lifecycle. Phase Save before running: step 1 creates a draft with POST /api/review-runs, validates criteria and sources, sets server-owned fields and an ETag, and does not call the model. Step 2 starts a run with POST /api/review-runs/{id}/execute and If-Match, requires draft status and run budget, takes one of the record's four runs, acquires a shared agent slot, and returns HTTP 409 for stale or competing starts. Step 3 saves a running snapshot with a conditional Cosmos DB write, stores the input, execution ETag, and recovery window, schedules local asyncio execution, returns HTTP 202, and keeps running if the browser disconnects. Phase Run, check, then save: step 4 calls Microsoft Foundry Agent Service using the existing coordinator and specialists, schema, and accumulated evidence, with managed identity and up to 180 seconds. Step 5 fail-closed checks verify specialist receipts, JSON schema, complete criterion coverage, and exact quotes from named sources. Step 6 conditionally writes findings or a failure code, observed events, and elapsed time using the run's ETag; model text cannot set the status, receipt flags, or events. The Cosmos DB record stores drafts, snapshots, results, ETags, and the 30-day TTL. The inbox can show completed, waiting_input, failed, or interrupted. Reading or refreshing a record never starts an agent call. Follow-up action step 7 adds evidence with POST /api/review-runs/{id}/evidence and If-Match, returning to draft and starting a new run from step 2. Follow-up action step 8 recovers an interrupted run with POST /api/review-runs/{id}/resume, If-Match, and confirm_cost true, starting a new call from saved input. Prior run inputs stay unchanged. Recovery reruns saved input; it is not exactly-once execution and may incur another charge. Execution runs inside the Lab process with one worker and one replica, no durable queue, no automatic retry, and no immutable audit ledger.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
