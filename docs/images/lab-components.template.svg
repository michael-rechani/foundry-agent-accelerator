<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Lab components and connections</title>
  <desc id="desc">The Lab component map has a Browser panel for a React and TypeScript web app with Chat and Agents, Document reviews, Create agent, and shared history. The browser uses same-origin HTTPS, has no Azure credentials, uses shared fictional data, and has no end-user sign-in. A request arrow labeled Same-origin HTTPS goes to an Internal Container App panel for Azure Container Apps. Inside the app, a FastAPI request boundary performs host and origin checks, validation, and admission before application routes for chat, history, reviews, and agent creation. The routes call the FoundryGateway class, which uses a selected agent, the Responses API, and store=false. The app has one worker per replica, shared process-local limits, and signs server calls with a managed identity. A managed-identity request arrow goes from FoundryGateway to Microsoft Foundry Agent Service. The Microsoft Foundry panel contains Agent Service with named endpoints and routed versions, an Application and case helper coordinator with profile-defined tools, Application checker and Case notes summarizer specialist agents, and one configured model deployment used by the coordinator and specialists. A request fork shows the coordinator calling specialists, and a gray link shows the coordinator and specialists use the configured model deployment. A data arrow labeled Cosmos reads and writes goes from application routes through the app's left channel to Application data, which is Azure Cosmos DB with a shared partition for chat, review, and created-agent records and container-scoped managed identity access. A link line connects Microsoft Foundry to platform dependencies: Storage, Cosmos DB, AI Search, and Key Vault as the Foundry platform backing services, with Key Vault for necessary secrets. A caveat states that APIM is optional and not in the default path, and boxes are logical, not deployment units.</desc>
