<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" role="img" aria-labelledby="title desc">
  <title id="title">Foundry Agent Accelerator</title>
  <desc id="desc">Foundry Agent Accelerator on one line, beside the official Microsoft Foundry service icon captioned with its product name. The icon names the service the sample builds on. It isn't a logo for the Accelerator.</desc>
  <rect width="1600" height="240" fill="#fff"/>
  <image href="azure-icons/foundry.svg" x="104" y="20" width="144" height="144"/>
  <text x="176" y="216" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="600" fill="#4d5b69">Microsoft Foundry</text>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-1" fill="#242424">
    <text x="360" y="150">Foundry Agent Accelerator</text>
  </g>
</svg>
