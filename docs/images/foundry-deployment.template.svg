<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Deploy with Terraform</title>
  <desc id="desc">Deployment ownership diagram. Before deployment, protected Blob state, approved private deployment access, one state key per root, and Entra authentication are supplied separately and are not created by these roots. The focal Platform root at terraform/ owns the Foundry account, project, model deployment, private network, identities, backing services, private monitoring, and optional API Management and admin VM. The platform passes reviewed IDs and names to roots that read platform resources: the Lab root at workbench/infra/ owns private Container Apps, registry, runtime identity, the application database, operational monitoring, an optional email action group with no recipients by default, and an optional Front Door Premium that is limited to approved client addresses; the optional Bastion root at terraform/bastion/ provides admin access and is billed while it exists; the optional agent monitoring root at terraform/monitoring/ provides metadata-only agent tracing. Release workflows, not Terraform hooks, build images and pin the Lab digest, publish agent versions and verify or recover routes, and run smoke checks and approved quality evaluations. A successful deployment does not prove answer quality, and each root keeps its own state.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #4d5b69; }
      .heading { font-size: 24px; font-weight: 600; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 20px; }
      .detail { font-size: 18px; }
      .small { font-size: 18px; fill: #4d5b69; }
      .pe { font-size: 18px; font-weight: 600; fill: #334e68; }
      .mono { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; font-weight: 600; fill: #334e68; }
      .cidr { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; fill: #4d5b69; }
      .label { font-size: 18px; fill: #4d5b69; font-weight: 600; }
      .boundary { font-size: 18px; font-weight: 600; fill: #4d5b69; letter-spacing: 0.4px; }
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#blue); }
      .result { fill: none; stroke: #00786a; stroke-width: 2.5; marker-end: url(#teal); }
      .data { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#teal); }
      .bus { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .line { fill: none; stroke: #0078d4; stroke-width: 2.5; }
      .link { fill: none; stroke: #8da6bb; stroke-width: 2; }
    </style>
  </defs>
