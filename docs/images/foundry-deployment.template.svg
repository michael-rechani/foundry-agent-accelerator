  <text x="72" y="814" class="detail">Application database + operational monitoring</text>
  <text x="72" y="840" class="detail">Optional: email action group and Front Door</text>
  <rect x="680" y="684" width="384" height="172" rx="10" fill="#fffaf0" stroke="#b59e59" stroke-width="1.5" stroke-dasharray="7 5"/>
  <image href="azure-icons/bastion.svg" x="692" y="696" width="36" height="36"/>
  <text x="738" y="720" class="name">Bastion root</text>
  <text x="696" y="760" class="mono">terraform/bastion/</text>
  <text x="696" y="788" class="detail">Optional admin access</text>
  <text x="696" y="814" class="detail">Billed while it exists</text>
  <rect x="1106" y="684" width="424" height="172" rx="10" fill="#fffaf0" stroke="#b59e59" stroke-width="1.5" stroke-dasharray="7 5"/>
  <image href="azure-icons/monitor.svg" x="1118" y="696" width="36" height="36"/>
  <text x="1164" y="720" class="name">Agent monitoring root</text>
  <text x="1122" y="760" class="mono">terraform/monitoring/</text>
  <text x="1122" y="788" class="detail">Optional agent tracing</text>
  <text x="1122" y="814" class="detail">Metadata only</text>
  <rect x="24" y="902" width="1552" height="198" rx="12" fill="#f5f7fa" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="40" y="940" class="name">Release workflows, not Terraform hooks</text>
  <text x="40" y="964" class="small">Run after infrastructure plans and applies are reviewed</text>
  <rect x="56" y="990" width="582" height="86" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <image href="azure-icons/container-registry.svg" x="68" y="1002" width="36" height="36"/>
