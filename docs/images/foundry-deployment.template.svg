  <rect x="1170" y="458" width="350" height="122" rx="10" fill="#fffaf0" stroke="#b59e59" stroke-width="1.5" stroke-dasharray="7 5"/>
  <image href="azure-icons/api-management.svg" x="1182" y="470" width="36" height="36"/>
  <text x="1228" y="494" class="name">Optional extras</text>
  <text x="1186" y="534" class="detail">APIM and admin VM</text>
  <rect x="24" y="626" width="1552" height="252" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
