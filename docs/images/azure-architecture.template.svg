<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Azure architecture at a glance</title>
  <desc id="desc">High-level design. A presenter signs in through Azure Bastion to a jumpbox in an optional admin network that is peered with a private workload network. The Lab runs in an internal Azure Container Apps environment with a managed identity. It runs agents in Foundry Agent Service, which uses Foundry Models, and saves records in Azure Cosmos DB. Foundry agents keep conversations, files and search data in Cosmos DB, Storage and AI Search through an agent subnet. Foundry, data services, Key Vault, Container Registry and Monitor are reached through private endpoints with public access off. Key Vault, Container Registry, managed identities and Azure Monitor are shared services. GitHub holds the code and Terraform deploys from the jumpbox. Model deployments are configurable; GPT-4.1 is the default. Optional API Management is not shown. This is a logical view, not a live resource inventory.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #4d5b69; }
      .heading { font-size: 24px; font-weight: 600; }
      .name { font-size: 21px; font-weight: 600; }
      .body { font-size: 21px; }
      .detail { font-size: 19px; }
      .small { font-size: 18px; fill: #4d5b69; }
      .label { font-size: 18px; fill: #4d5b69; font-weight: 600; }
      .boundary { font-size: 19px; font-weight: 600; fill: #4d5b69; letter-spacing: 0.4px; }
      .num { font-size: 19px; font-weight: 700; fill: #fff; }
      .banner { font-size: 27px; font-weight: 600; fill: #fff; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#blue); }
      .data { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#teal); }
      .flow { fill: none; stroke: #0078d4; stroke-width: 3; marker-end: url(#blue); }
    </style>
  </defs>
  <rect width="1600" height="1070" fill="#fff"/>
  <text x="24" y="50" class="title">Azure architecture at a glance</text>
  <text x="24" y="86" class="sub">Services are reached through private endpoints with public access turned off, and they sign in with managed identities instead of keys.</text>
