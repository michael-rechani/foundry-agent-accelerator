  <text x="44" y="746" class="detail">Code and tests</text>
  <text x="44" y="772" class="detail">Dependabot updates</text>
  <text x="44" y="798" class="detail"></text>
  <text x="44" y="824" class="detail">Terraform deploys</text>
  <text x="44" y="850" class="detail">from the jumpbox</text>
