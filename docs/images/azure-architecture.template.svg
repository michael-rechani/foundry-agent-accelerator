<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1342" viewBox="0 0 1600 1342" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Azure architecture at a glance</title>
  <desc id="desc">Reference-style network view with numbered request steps. Everything sits in one Azure subscription and one resource group. An admin network holds optional Azure Bastion and an optional Windows jumpbox that has only a private IP address. It is peered with a private workload network that holds the Lab in an internal Azure Container Apps environment with a managed identity, an agent network delegated to Foundry so hosted agents reach their data privately, and one private endpoint each for Foundry, Cosmos DB, Storage, AI Search, Key Vault, Container Registry and Azure Monitor. Step 1: a presenter or admin opens Azure Bastion over HTTPS. Step 2: Bastion opens a remote desktop session to the jumpbox. Step 3: the jumpbox browser opens the Lab across the network peering; the Lab accepts traffic only from the jumpbox. Step 4: the Lab calls Foundry Agent Service in the Foundry project through the Foundry private endpoint. Step 5: the coordinator and two specialists run on Foundry Models; GPT-4.1 is the default deployment. Step 6: Foundry Agent Service connects the agents to the delegated agent network, and from there hosted agents keep conversations, files and search data in Azure Cosmos DB, Azure Storage and Azure AI Search through their private endpoints. Step 7: the Lab saves its records in Azure Cosmos DB through the same private endpoint. Key Vault holds the admin password and the Lab's creation key, Container Registry holds the Lab's image, and Azure Monitor collects logs, agent traces and alerts. Optionally, Azure Front Door Premium adds a public edge: an allowed client reaches its public endpoint over HTTPS, a web application firewall allow list blocks every other address, and Front Door-managed Private Link carries the request to the internal Lab, which then accepts Front Door as well as the jumpbox. It is off by default and needs explicit approval. Managed identities replace keys, and private DNS zones resolve private names in both networks. GitHub holds the code and Terraform runs from the jumpbox. Optional API Management is not shown. This is a logical view, not a live resource inventory.</desc>
