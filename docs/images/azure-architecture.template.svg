<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1188" viewBox="0 0 1600 1188" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Azure architecture at a glance</title>
  <desc id="desc">Reference-style network view with numbered request steps. Everything sits in one Azure subscription and one resource group. An admin network, 10.43.0.0/16, holds AzureBastionSubnet with optional Azure Bastion and snet-jumpbox, 10.43.0.0/24, with an optional Windows jumpbox that has only a private IP address. It is peered with a private workload network, 10.42.0.0/16, that has three subnets: snet-foundry-workbench, 10.42.2.0/24, holds the Lab in an internal Azure Container Apps environment with a managed identity; snet-agent-services, 10.42.1.0/24, is delegated to Foundry so hosted agents reach their data privately; and snet-private-endpoints, 10.42.0.0/24, holds one private endpoint each for Foundry, Cosmos DB, Storage, AI Search, Key Vault, Container Registry and Azure Monitor. Step 1: a presenter or admin opens Azure Bastion over HTTPS. Step 2: Bastion opens a remote desktop session to the jumpbox. Step 3: the jumpbox browser opens the Lab across the network peering; the Lab accepts traffic only from the jumpbox subnet. Step 4: the Lab calls Foundry Agent Service in the Foundry project through the Foundry private endpoint. Step 5: the coordinator and two specialists run on Foundry Models; GPT-4.1 is the default deployment. Step 6: from the agent subnet, hosted agents keep conversations, files and search data in Azure Cosmos DB, Azure Storage and Azure AI Search through their private endpoints. Step 7: the Lab saves its records in Azure Cosmos DB through the same private endpoint. Key Vault holds the admin password and the Lab's creation key, Container Registry holds the Lab's image, and Azure Monitor collects logs, agent traces and alerts. Managed identities replace keys, and private DNS zones resolve private names in both networks. GitHub holds the code and Terraform runs from the jumpbox. Addresses are Terraform defaults. Optional API Management is not shown. This is a logical view, not a live resource inventory.</desc>
