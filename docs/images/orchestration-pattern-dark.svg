<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1014" viewBox="0 0 1600 1014" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Which orchestration pattern the Lab uses</title>
  <desc id="desc">Compares the Lab's default review coordinator with the five patterns in the Microsoft Azure Architecture Center guide, AI agent orchestration patterns. Sequential: agents run in a fixed order and each builds on the last; not used. Concurrent: several agents work on the same input at the same time; not the default. Group chat: agents share one thread and a manager picks who speaks; not used. Handoff, also called routing: an agent passes the task to a better-suited specialist; this is the closest match. Magentic: a manager builds and adapts a task plan as work proceeds; not used. The match is close but not exact. In the guide's handoff, control moves from agent to agent, any agent can end the task, and one agent is active at a time. In the Lab, the coordinator calls one specialist, or both only if the user asks. Specialists work as its tools, every result comes back to it, and control always stays with it. People stay in charge: for an unclear request the coordinator asks a question first, a person checks each answer against the evidence, and there is no automatic approval, denial, or external action. Why this fit: every extra agent adds latency, cost, and another point of failure. Pattern names and descriptions are adapted from Microsoft's guide under CC BY 4.0; the schematics are redrawn for this repository.</desc>
