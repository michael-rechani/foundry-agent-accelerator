<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img" aria-labelledby="title desc">
  <title id="title">Application completeness: synthetic evidence to a reviewable result</title>
  <desc id="desc">An illustrative permit application has no budget, a named Facilities team owner, and conflicting completion dates. A coverage matrix reports not demonstrated, met, and unclear. People verify the evidence and make decisions. This is not captured model output.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1280" height="670" rx="20" fill="url(#background)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="44" y="46" font-size="15" font-weight="700" fill="#1d4ed8">MICROSOFT FOUNDRY ON AZURE / ONE SCENARIO</text>
    <text x="44" y="91" font-size="32" font-weight="700" fill="#172b4d">From sample evidence to a reviewable result</text>
    <text x="44" y="124" font-size="17" fill="#40516b">Application completeness - identify gaps and conflicts before a person decides.</text>

    <rect x="44" y="158" width="496" height="382" rx="14" fill="#fff" stroke="#cdd9eb"/>
    <rect x="44" y="158" width="496" height="56" rx="14" fill="#e0ebfc"/>
    <text x="68" y="194" font-size="21" font-weight="700" fill="#172b4d">1. Supplied synthetic input</text>
    <text x="68" y="247" font-size="16" font-weight="700" fill="#344663">CRITERIA</text>
    <text x="68" y="277" font-size="17" fill="#172b4d">CRIT-1  Budget</text>
    <text x="68" y="305" font-size="17" fill="#172b4d">CRIT-2  Implementation owner</text>
    <text x="68" y="333" font-size="17" fill="#172b4d">CRIT-3  Delivery schedule</text>
    <path d="M68 352 H516" stroke="#e1e7ef"/>
    <text x="68" y="382" font-size="16" font-weight="700" fill="#344663">APPLICATION MATERIAL</text>
    <text x="68" y="413" font-size="17" fill="#172b4d">APP-1  Owner: Facilities team</text>
    <text x="68" y="443" font-size="17" fill="#172b4d">APP-2  Completion: June 30, 2027</text>
    <text x="68" y="473" font-size="17" fill="#172b4d">APP-3  Completion: July 31, 2027</text>
    <text x="68" y="511" font-size="17" font-weight="600" fill="#925500">No budget supplied</text>

    <path d="M555 347 H621" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="640" y="158" width="596" height="382" rx="14" fill="#fff" stroke="#cdd9eb"/>
    <rect x="640" y="158" width="596" height="56" rx="14" fill="#e0ebfc"/>
    <text x="664" y="194" font-size="21" font-weight="700" fill="#172b4d">2. Findings for human review</text>
    <rect x="664" y="234" width="548" height="78" rx="8" fill="#fff7e5"/>
    <text x="680" y="261" font-size="18" font-weight="700" fill="#764600">Budget / Not demonstrated</text>
    <text x="680" y="288" font-size="16" fill="#533c19">CRIT-1: request evidence; do not infer noncompliance.</text>
    <rect x="664" y="324" width="548" height="78" rx="8" fill="#eaf6ee"/>
    <text x="680" y="351" font-size="18" font-weight="700" fill="#205b34">Owner / Met in supplied material</text>
    <text x="680" y="378" font-size="16" fill="#264732">CRIT-2 + APP-1: Facilities team is named.</text>
    <rect x="664" y="414" width="548" height="78" rx="8" fill="#f1edfc"/>
    <text x="680" y="441" font-size="18" font-weight="700" fill="#5e3d91">Schedule / Unclear</text>
    <text x="680" y="468" font-size="16" fill="#493363">CRIT-3 + APP-2 / APP-3: which schedule is current?</text>
    <text x="664" y="520" font-size="15" fill="#40516b">Source references are not independent proof of truth.</text>

    <rect x="44" y="562" width="1192" height="54" rx="10" fill="#172b4d"/>
    <text x="66" y="596" font-size="19" font-weight="600" fill="#fff">Human checkpoint: verify evidence. No automated approval, denial, or external action.</text>
    <text x="44" y="645" font-size="15" fill="#40516b">Illustrative result, not captured model output. Synthetic data only; shared Lab history has no per-user authorization.</text>
  </g>
</svg>
