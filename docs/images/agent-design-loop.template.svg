<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">How testing a draft works</title>
  <desc id="desc">How testing a draft agent works, in eight numbered steps. Nothing is published while you test, and you read the answers and decide what to keep. Write and run the tests: in step 1, you choose Test this draft first on the spec card and tick the cost confirmation once, with no model call. In step 2, one model call writes three to eight sample test cases, about 1,700 tokens, and the Lab drops any case that breaks its rules and says how many it dropped. In step 3, each case runs one to three times, one call at a time, stopping at the first error, about 800 to 900 tokens per case, and the Lab screens each answer with its fixed checks. In step 4, you read each answer against its rubric, because passing the screen is not proof that an answer is right. The loop: if cases fail, step 5 is one model call, about 1,600 tokens, that rewrites the task instructions only and shows its reasons and a line diff. In step 6, you accept or discard the revision. Nothing changes until you accept, and accepting makes no model call. In step 7, the cases run again: the failed cases, any that never ran, and the first two that passed, so a fix that broke another answer shows up. Then you read the new answers, which takes you back to step 4. A revision can change the task instructions only. It cannot change the checks, the tools, the template, the Lab's own safety text, or your own task line, which the Lab puts back exactly if a reply drops it. Done or stuck: in step 8, you use the tested text. Create in Foundry publishes the text you tested, and Start from opens Create agent with that same text. You can accept two revisions at most per set of cases, and after that you read the failed answers and edit the text yourself. Start over with new cases drops the accepted text and the earlier rounds, and the cases stay in your browser. Every call needs the cost confirmation, and a revision the Lab rejects was still a call, so it may be charged. Token counts come from two live runs with fictional data.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #4d5b69; }
      .name { font-size: 20px; font-weight: 600; }
      .detail { font-size: 18px; }
      .small { font-size: 18px; fill: #4d5b69; }
      .pe { font-size: 18px; font-weight: 600; fill: #334e68; }
      .boundary { font-size: 18px; font-weight: 600; fill: #4d5b69; letter-spacing: 0.4px; }
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#blue); }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#fff"/>
  <text x="24" y="50" class="title">How testing a draft works</text>
  <text x="24" y="86" class="sub">Nothing is published while you test. You read the answers and decide what to keep.</text>
