<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Operate and protect the Lab</title>
  <desc id="desc">Three independent operational lanes, not a sequential workflow. In Observe, the Lab runtime has limits and deadlines, cached health probes, one worker, one replica, and no prompt logging; it sends metadata to Azure Monitor and Log Analytics through private ingestion and private queries with local keys disabled, and action groups are existing or Terraform-owned. Separately, Foundry hosted agents can optionally send metadata-only agent traces to a workspace-based Application Insights resource connected to the Foundry project, with private ingestion. In Build and publish, an approved private build runner with a Linux Docker engine and approved identity pushes the Lab image to Azure Container Registry over private access; the registry has a private endpoint only and admin access is disabled. The Lab pulls the approved image by digest and runs the pinned image. In Protect state, Terraform uses private access, Entra authentication, and keyless resource reads to read and write Azure Blob Storage state, with one state key per root, locking, protected versions, and an existing backend not created here. Azure Key Vault holds only necessary secrets; prefer managed identity, and state plus backups still need their own protection.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #4d5b69; }
      .heading { font-size: 24px; font-weight: 600; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 20px; }
      .detail { font-size: 18px; }
      .small { font-size: 18px; fill: #4d5b69; }
      .pe { font-size: 18px; font-weight: 600; fill: #334e68; }
      .mono { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; font-weight: 600; fill: #334e68; }
      .cidr { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; fill: #4d5b69; }
      .label { font-size: 18px; fill: #4d5b69; font-weight: 600; }
      .boundary { font-size: 18px; font-weight: 600; fill: #4d5b69; letter-spacing: 0.4px; }
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#blue); }
      .result { fill: none; stroke: #00786a; stroke-width: 2.5; marker-end: url(#teal); }
      .data { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#teal); }
      .bus { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .line { fill: none; stroke: #0078d4; stroke-width: 2.5; }
      .link { fill: none; stroke: #8da6bb; stroke-width: 2; }
    </style>
  </defs>
