  <text x="108" y="1062" class="name">Azure Key Vault holds only necessary secrets</text>
  <text x="108" y="1090" class="detail">Prefer managed identity; state and backups still need their own protection.</text>
  <text x="24" y="1138" class="boundary">LEGEND</text>
