  <text x="72" y="664" class="detail">Private access</text>
  <text x="72" y="688" class="detail">Linux Docker engine</text>
  <text x="72" y="712" class="detail">Approved identity</text>
  <rect x="660" y="596" width="410" height="132" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <image href="azure-icons/container-registry.svg" x="672" y="608" width="36" height="36"/>
  <text x="718" y="632" class="name">Azure Container Registry</text>
  <text x="718" y="656" class="small">Private registry</text>
  <text x="676" y="690" class="detail">Private endpoint only</text>
  <text x="676" y="714" class="detail">Registry admin disabled</text>
  <rect x="1224" y="596" width="300" height="132" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <image href="azure-icons/container-apps.svg" x="1236" y="608" width="36" height="36"/>
  <text x="1282" y="632" class="name">The Lab</text>
  <text x="1282" y="656" class="small">Approved image</text>
