  <text x="72" y="898" class="detail">Private access</text>
  <text x="72" y="922" class="detail">Entra authentication</text>
  <text x="72" y="946" class="detail">Keyless resource reads</text>
  <rect x="660" y="830" width="860" height="150" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <image href="azure-icons/storage.svg" x="672" y="842" width="36" height="36"/>
  <text x="718" y="866" class="name">Azure Blob Storage</text>
  <text x="718" y="890" class="small">Terraform backend</text>
  <text x="676" y="924" class="detail">One state key per root</text>
  <text x="676" y="947" class="detail">Locking + protected versions</text>
  <text x="676" y="970" class="detail">Existing backend; not created here</text>
