  <text x="40" y="156" class="boundary">OBSERVE</text>
  <rect x="56" y="170" width="414" height="154" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="72" y="206" class="name">Lab runtime</text>
  <text x="72" y="238" class="detail">Limits and deadlines</text>
  <text x="72" y="262" class="detail">Cached health probes</text>
  <text x="72" y="286" class="detail">One worker, one replica</text>
  <text x="72" y="310" class="detail">No prompt logging</text>
