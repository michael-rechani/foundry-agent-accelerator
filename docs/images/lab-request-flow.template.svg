  <path d="M470 244V1065" class="link"/>
  <path d="M812 292V1065" class="link"/>
  <path d="M1120 292V1065" class="link"/>
  <path d="M1419 306V1065" class="link"/>
  <path d="M165 320H462" class="request"/>
  <circle cx="250" cy="320" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="250" y="326" class="num" text-anchor="middle">1</text>
  <text x="322" y="280" class="mono" text-anchor="middle">POST /api/reviews</text>
  <text x="322" y="302" class="small" text-anchor="middle">Message + bounded history</text>
  <rect x="326" y="350" width="300" height="76" rx="8" fill="#f5f7fa" stroke="#cdd9e2" stroke-width="1.5"/>
  <text x="342" y="380" class="small">Origin, input, and catalog checks</text>
  <text x="342" y="404" class="small">Admission before agent execution</text>
  <path d="M470 500H804" class="request"/>
  <circle cx="620" cy="500" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="620" y="506" class="num" text-anchor="middle">2</text>
  <text x="642" y="460" class="small" text-anchor="middle">Responses API call</text>
  <text x="642" y="482" class="mono" text-anchor="middle">Managed identity, store=false</text>
  <rect x="676" y="510" width="548" height="220" rx="12" fill="#fffaf0" stroke="#b59e59" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="830" y="542" class="boundary">IF SPECIALIST SELECTED</text>
  <path d="M812 625H1112" class="request"/>
  <circle cx="905" cy="625" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="905" y="631" class="num" text-anchor="middle">3</text>
  <text x="970" y="583" class="small" text-anchor="middle">Full supplied request</text>
  <text x="970" y="605" class="small" text-anchor="middle">Named target</text>
  <path d="M1120 695H820" class="result"/>
  <circle cx="1048" cy="695" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="1048" y="701" class="num" text-anchor="middle">4</text>
  <text x="970" y="653" class="small" text-anchor="middle">Completed, nonempty output</text>
  <text x="970" y="675" class="small" text-anchor="middle">Tool result names invoked agent</text>
  <path d="M812 810H478" class="result"/>
  <circle cx="610" cy="810" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="610" y="816" class="num" text-anchor="middle">5</text>
  <text x="650" y="770" class="small" text-anchor="middle">Final answer + tool outputs</text>
  <text x="650" y="792" class="small" text-anchor="middle">Call IDs allow receipt correlation</text>
  <rect x="506" y="832" width="282" height="66" rx="8" fill="#f5f7fa" stroke="#cdd9e2" stroke-width="1.5"/>
  <text x="522" y="862" class="small">Bound response size</text>
  <text x="522" y="886" class="small">Compute receipt flags</text>
  <path d="M470 870H173" class="result"/>
  <circle cx="285" cy="870" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="285" y="876" class="num" text-anchor="middle">6</text>
  <text x="322" y="830" class="small" text-anchor="middle">Answer + receipt status</text>
  <text x="322" y="852" class="small" text-anchor="middle">No implicit Cosmos write</text>
  <rect x="24" y="915" width="1552" height="150" rx="16" fill="#fff" stroke="#8da6bb" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="40" y="946" class="boundary">LATER, ONLY IF THE USER SAVES</text>
  <path d="M165 1030H462" class="request"/>
  <circle cx="250" cy="1030" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="250" y="1036" class="num" text-anchor="middle">7</text>
  <text x="318" y="990" class="mono" text-anchor="middle">POST /api/conversations</text>
  <text x="318" y="1012" class="small" text-anchor="middle">Save the completed exchange</text>
  <path d="M470 1030H1411" class="data"/>
  <circle cx="930" cy="1030" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="930" y="1036" class="num" text-anchor="middle">8</text>
  <text x="930" y="1002" class="small" text-anchor="middle">Create or conditional update · managed identity</text>
  <rect x="24" y="1086" width="1552" height="112" rx="8" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="42" y="1120" class="name">Caveats and limits</text>
  <text x="250" y="1118" class="detail">Clarification may return without delegation.</text>
  <text x="250" y="1144" class="detail">Receipt status is not a strict citation verdict.</text>
  <text x="250" y="1170" class="detail">Document reviews add stricter gates.</text>
  <text x="720" y="1118" class="detail">Lab: 4 in-flight agent calls,</text>
  <text x="720" y="1144" class="detail">20 per minute, up to 180 seconds.</text>
  <text x="720" y="1170" class="detail">Specialists: 4 slots and 90 seconds.</text>
  <text x="1140" y="1118" class="detail">Timeout or browser cancellation</text>
  <text x="1140" y="1144" class="detail">may not stop remote work.</text>
  <text x="1140" y="1170" class="detail">No automatic model retry.</text>
  <text x="24" y="1226" class="boundary">LEGEND</text>
  <path d="M120 1220H176" class="request"/>
  <text x="186" y="1226" class="small">Request</text>
  <path d="M287 1220H343" class="result"/>
  <text x="353" y="1226" class="small">Result</text>
  <path d="M441 1220H497" class="data"/>
  <text x="507" y="1226" class="small">Data read or write</text>
  <path d="M684 1220H740" class="link"/>
  <text x="750" y="1226" class="small">Lifeline</text>
  <rect x="849" y="1206" width="44" height="28" rx="6" fill="#fffaf0" stroke="#b59e59" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="903" y="1226" class="small">Optional</text>
  <rect x="1006" y="1206" width="44" height="28" rx="6" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="1060" y="1226" class="small">Caveat</text>
  <circle cx="1166" cy="1220" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="1166" y="1226" class="num" text-anchor="middle">n</text>
  <text x="1192" y="1226" class="small">Step</text>
  <circle cx="1280" cy="1220" r="15" fill="#00786a" stroke="#fff" stroke-width="2.5"/>
  <text x="1280" y="1226" class="num" text-anchor="middle">n</text>
  <text x="1306" y="1226" class="small">Data step</text>
</svg>
