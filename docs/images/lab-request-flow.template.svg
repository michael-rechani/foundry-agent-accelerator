<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">How a chat request flows</title>
  <desc id="desc">Sequence diagram for a Lab chat request. Participant cards identify Browser / Lab (React), FastAPI plus FoundryGateway, a Microsoft Foundry Agent Service header containing Coordinator and Specialist cards, and Cosmos DB shared history. Step 1 sends POST /api/reviews with the message and bounded history from the browser to FastAPI. FastAPI performs origin, input, catalog, and admission checks before agent execution. Step 2 calls the coordinator through the Responses API using managed identity and store=false. In an optional specialist frame, step 3 sends the full supplied request and named target to a selected specialist, and step 4 returns a completed, nonempty output whose tool result names the invoked agent. Step 5 returns the final answer and tool outputs to FastAPI so call IDs can correlate receipts; FastAPI bounds the response size and computes receipt verification flags. Step 6 returns the answer and receipt status to the browser with no implicit Cosmos write. A separate later boundary shows explicit saving: step 7 sends POST /api/conversations from the browser to FastAPI to save the completed exchange, and step 8 writes or conditionally updates Cosmos DB shared history with managed identity. Saved receipts are recorded, not verified, and have a 30-day TTL since the last write. A caveat note says chat may return clarification without delegation, reports receipt status rather than a strict citation verdict, document reviews add stricter receipt and quote gates, the Lab allows four in-flight agent calls, twenty starts per minute, and up to 180 seconds, specialists default to four slots and 90 seconds, local timeout or browser cancellation may not stop remote work, and there is no automatic model retry.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 34px; font-weight: 600; }
      .sub { font-size: 21px; fill: #4d5b69; }
      .heading { font-size: 24px; font-weight: 600; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 20px; }
      .detail { font-size: 18px; }
      .small { font-size: 18px; fill: #4d5b69; }
      .pe { font-size: 18px; font-weight: 600; fill: #334e68; }
      .mono { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; font-weight: 600; fill: #334e68; }
      .cidr { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 17px; fill: #4d5b69; }
      .label { font-size: 18px; fill: #4d5b69; font-weight: 600; }
      .boundary { font-size: 18px; font-weight: 600; fill: #4d5b69; letter-spacing: 0.4px; }
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#blue); }
      .result { fill: none; stroke: #00786a; stroke-width: 2.5; marker-end: url(#teal); }
      .data { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#teal); }
      .bus { fill: none; stroke: #00786a; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .line { fill: none; stroke: #0078d4; stroke-width: 2.5; }
      .link { fill: none; stroke: #8da6bb; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="1250" fill="#fff"/>
  <text x="24" y="50" class="title">How a chat request flows</text>
  <text x="24" y="86" class="sub">The deployed Lab calls named Foundry endpoints directly; APIM is not in this path. Numbers follow one request.</text>
  <rect x="40" y="140" width="250" height="104" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="56" y="176" class="name">Browser / Lab</text>
  <text x="56" y="200" class="small">React UI</text>
  <text x="56" y="234" class="detail">User asks or saves</text>
  <rect x="320" y="140" width="300" height="104" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="336" y="176" class="name">FastAPI + FoundryGateway</text>
  <text x="336" y="200" class="small">Admission and Responses client</text>
  <rect x="650" y="116" width="590" height="205" rx="12" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
  <image href="azure-icons/agent-service.svg" x="664" y="130" width="36" height="36"/>
  <text x="710" y="154" class="name">Microsoft Foundry Agent Service</text>
  <text x="710" y="178" class="small">Custom hosted agents</text>
  <rect x="690" y="200" width="245" height="92" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="706" y="236" class="name">Coordinator</text>
  <text x="706" y="260" class="small">Profile-defined tools</text>
  <rect x="1016" y="200" width="208" height="92" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="1032" y="236" class="name">Specialist</text>
  <text x="1032" y="260" class="small">Application or case</text>
  <rect x="1262" y="140" width="314" height="166" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <image href="azure-icons/cosmos-db.svg" x="1274" y="152" width="36" height="36"/>
  <text x="1320" y="176" class="name">Cosmos DB shared history</text>
  <text x="1320" y="200" class="small">Explicitly saved chats</text>
  <text x="1278" y="234" class="detail">Saves receipts as recorded,</text>
  <text x="1278" y="260" class="detail">not verified</text>
  <text x="1278" y="286" class="detail">30-day TTL since last write</text>
