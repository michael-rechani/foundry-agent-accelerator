  <text x="618" y="682" class="name">Publish and verify</text>
  <text x="618" y="714" class="detail">Create a new hosted version</text>
  <text x="618" y="740" class="detail">Check documented</text>
  <text x="618" y="766" class="detail">release gates</text>
  <circle cx="968" cy="676" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="968" y="682" class="num" text-anchor="middle">5</text>
  <rect x="1136" y="646" width="396" height="142" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
  <text x="1152" y="682" class="name">Route, review, iterate</text>
  <text x="1152" y="714" class="detail">Check answers against evidence</text>
  <text x="1152" y="740" class="detail">Use guarded recovery</text>
  <circle cx="1502" cy="676" r="15" fill="#0078d4" stroke="#fff" stroke-width="2.5"/>
  <text x="1502" y="682" class="num" text-anchor="middle">6</text>
  <path d="M800 540V566" class="data"/>
  <path d="M472 708H594" class="request"/>
  <path d="M1006 708H1128" class="request"/>
  <rect x="40" y="824" width="1520" height="50" rx="8" fill="#fff4ce" stroke="#b59e59" stroke-width="1.5"/>
  <text x="64" y="856" class="name">Caveats</text>
  <text x="164" y="856" class="detail">Logical workflow only; CLI and Lab release paths have different gates; a code push is not a deployment.</text>
  <text x="24" y="938" class="boundary">LEGEND</text>
