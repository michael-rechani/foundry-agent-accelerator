  <image href="azure-icons/users.svg" x="1094" y="404" width="36" height="36"/>
  <text x="1140" y="428" class="name">People approve</text>
  <text x="1140" y="452" class="small">Required human decisions</text>
  <text x="1140" y="476" class="detail">Infrastructure changes</text>
  <text x="1140" y="500" class="detail">Publication costs</text>
  <text x="1140" y="524" class="detail">Business decisions</text>
  <rect x="40" y="574" width="1520" height="230" rx="12" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
  <image href="azure-icons/agent-service.svg" x="54" y="588" width="36" height="36"/>
  <text x="100" y="612" class="name">Agent releases</text>
  <text x="100" y="636" class="small">Reviewed code, instructions, and versioned configuration</text>
  <rect x="68" y="646" width="396" height="142" rx="10" fill="#fff" stroke="#aebdcb" stroke-width="1.5"/>
