  <text x="84" y="240" class="name">Review the plan</text>
  <text x="84" y="272" class="detail">Permissions, quota,</text>
  <text x="84" y="298" class="detail">cost approval</text>
  <text x="84" y="324" class="detail">Protected remote state</text>
