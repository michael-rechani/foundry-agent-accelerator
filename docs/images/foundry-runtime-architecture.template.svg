  <text x="1150" y="960" class="heading">Cosmos history</text>
  <text x="1110" y="986" class="small muted">Shared, editable / 30-day TTL</text>
  <text x="1110" y="1006" class="small muted">Synthetic data only / backups separate</text>

  <path d="M485 1040V1080H740" class="flow"/>
  <text x="503" y="1070" class="small muted">Metadata only</text>
  <rect x="752" y="1065" width="608" height="90" class="boundary"/>
  <text x="772" y="1095" class="heading">Log Analytics + Azure Monitor</text>
  <text x="772" y="1120" class="body">30-day retention / 0.1 GB daily cap / local key auth disabled</text>
  <text x="772" y="1142" class="small muted">Failure, throttle, dependency and heartbeat alerts; notification recipient pending</text>

  <image href="azure-icons/storage.svg" x="50" y="1110" width="36" height="36"/>
  <text x="102" y="1124" class="heading">Remote Terraform state</text>
  <text x="102" y="1148" class="small muted">Separate platform and Lab keys / Entra / locking / private access</text>
  <path d="M40 1180H1360" stroke="#d1d1d1"/>
  <image href="azure-icons/key-vault.svg" x="50" y="1200" width="38" height="38"/>
  <text x="106" y="1216" class="heading">Key Vault: required home for necessary secrets; prefer managed identity to keys</text>
  <text x="106" y="1243" class="body planned">Open migration: jumpbox password and provider-returned keys still have Terraform state/history copies.</text>
