  <image href="azure-icons/foundry-models.svg" x="899" y="662" width="38" height="38"/>
  <text x="918" y="724" text-anchor="middle" class="small">Foundry Models</text>
  <image href="azure-icons/cosmos-db.svg" x="1024" y="662" width="38" height="38"/>
  <text x="1043" y="724" text-anchor="middle" class="small">Cosmos DB</text>
  <image href="azure-icons/storage.svg" x="1149" y="662" width="38" height="38"/>
  <text x="1168" y="724" text-anchor="middle" class="small">Storage</text>
  <image href="azure-icons/key-vault.svg" x="1274" y="662" width="38" height="38"/>
  <text x="1293" y="724" text-anchor="middle" class="small">Key Vault</text>
  <text x="885" y="765" class="small muted">AI Search and Log Analytics also support the platform.</text>

  <path d="M40 843H1360" stroke="#d1d1d1"/>
  <text x="40" y="875" class="heading">AI Foundry Lab: deployed private runtime and operations</text>
  <text x="40" y="901" class="small muted">Logical runtime detail. The Lab uses a dedicated subnet in the workload VNet; the browser runs on the management jumpbox.</text>

  <rect x="40" y="925" width="210" height="95" class="subnet"/>
  <text x="58" y="955" class="heading">Jumpbox browser</text>
  <text x="58" y="982" class="small muted">Private HTTPS / subnet allowlist</text>
  <text x="58" y="1003" class="small muted">No end-user sign-in</text>
  <path d="M250 973H325" class="flow"/>
  <rect x="335" y="925" width="300" height="115" class="network"/>
  <text x="355" y="955" class="heading">AI Foundry Lab</text>
  <text x="355" y="982" class="body">Internal Container App</text>
  <text x="355" y="1004" class="small muted">React + FastAPI / managed identity</text>
  <text x="355" y="1025" class="small muted">Bounded requests / cached dependency checks</text>
  <path d="M635 951H742" class="flow"/>
  <text x="656" y="940" class="small muted">Identity</text>
  <rect x="752" y="925" width="268" height="67" class="agent"/>
  <text x="772" y="952" class="heading">Foundry customer review</text>
