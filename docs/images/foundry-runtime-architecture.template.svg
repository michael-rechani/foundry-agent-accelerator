<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Foundry review architecture</title>
  <desc id="desc">Private Foundry agents, a deployed AI Foundry Lab and an unpublished APIM API. The jumpbox browser reaches the internal Lab, which uses managed identity for Foundry and shared Cosmos history. Operational metadata goes to Log Analytics and Azure Monitor. Separate encrypted remote-state keys use Entra authentication. Key Vault is the required secret store, but legacy credential and provider-key state copies still require migration. Dashed lines mark the unpublished API. Official Azure service icons are unmodified.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0078d4"/></marker>
    <marker id="pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a6200"/></marker>
    <style>
      text { font-family: 'Segoe UI', sans-serif; letter-spacing: 0; fill: #242424; }
      .title { font-size: 30px; font-weight: 600; }
      .heading { font-size: 18px; font-weight: 600; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .muted { fill: #515151; }
      .planned { fill: #795600; }
      .flow { fill: none; stroke: #0078d4; stroke-width: 2; marker-end: url(#arrow); }
      .pending { fill: none; stroke: #8a6200; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#pending); }
      .boundary { fill: #fafafa; stroke: #a0a0a0; stroke-width: 1.5; }
      .network { fill: #f2f8fd; stroke: #0078d4; stroke-width: 1.5; }
      .subnet { fill: #fff; stroke: #80b9e5; stroke-dasharray: 5 4; }
      .agent { fill: #fff; stroke: #008575; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1400" height="1280" fill="#fff"/>
  <text x="40" y="55" class="title">Microsoft Foundry review architecture</text>
  <text x="40" y="85" class="body muted">Private agent execution and AI Foundry Lab; APIM API remains unpublished</text>
  <path d="M985 42H1025" class="flow"/><text x="1040" y="47" class="small">Implemented connection</text>
  <path d="M985 72H1025" class="pending"/><text x="1040" y="77" class="small">API route pending publication</text>

  <rect x="230" y="125" width="1130" height="690" class="boundary"/>
  <text x="250" y="153" class="heading">Azure resource group</text>

