<svg xmlns="http://www.w3.org/2000/svg" width="760" height="970" viewBox="0 0 760 970" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">How the review agents collaborate</title>
  <desc id="desc">Default guided-review flow. A person sends a question and supplied evidence through the Lab. The review coordinator in Microsoft Foundry Agent Service chooses the application-review or case-review tool, using both only when explicitly requested. Each specialist receives the complete request and source identifiers, then returns a completed, nonempty response to the same coordinator. Coordinator tools wrap successful responses with status, agent, and output. The Lab checks correlated tool records and shows the answer for a person to verify. Specialists do not call each other. Ambiguous requests need clarification; failed calls must not be replaced with invented findings. This is a logical interaction diagram, not a deployment or network map.</desc>
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0078d4"/>
    </marker>
    <marker id="result-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00786a"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #242424; }
      .title { font-size: 30px; font-weight: 600; }
      .heading { font-size: 25px; font-weight: 600; }
      .body { font-size: 22px; }
      .detail { font-size: 20px; }
      .label { font-size: 20px; fill: #4d5b69; }
      .tool { font-family: Consolas, monospace; font-size: 20px; fill: #334e68; }
      .request { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#request-arrow); }
      .result { fill: none; stroke: #00786a; stroke-width: 2.5; marker-end: url(#result-arrow); }
    </style>
  </defs>

  <rect width="760" height="970" fill="#fff"/>
  <text x="24" y="42" class="title">How the review agents collaborate</text>
  <text x="24" y="74" class="detail">Default profile: one coordinator, focused specialists, human review.</text>

  <g id="requester">
    <rect x="120" y="100" width="520" height="90" rx="12" fill="#f5f7fa" stroke="#aebdcb" stroke-width="1.5"/>
    <text x="146" y="137" class="heading">1  Ask in the Lab</text>
    <text x="146" y="168" class="body">Question + supplied evidence</text>
  </g>
  <path d="M380 190V222" class="request"/>
  <text x="402" y="212" class="label">Request</text>

  <rect x="24" y="222" width="712" height="538" rx="16" fill="#f3f8fc" stroke="#8abce0" stroke-width="1.5"/>
  <image href="data:image/svg+xml;base64," x="48" y="238" width="36" height="36"/>
  <text x="98" y="264" class="heading">Microsoft Foundry Agent Service</text>
  <path d="M380 276V292" class="request"/>

  <g id="coordinator">
    <rect x="120" y="292" width="520" height="98" rx="12" fill="#fff" stroke="#0078d4" stroke-width="2"/>
    <text x="146" y="330" class="heading">2  Review coordinator</text>
    <text x="146" y="362" class="body">One tool; both only when requested</text>
  </g>
  <path d="M380 390V418H204V472" class="request"/>
  <path d="M380 418H556V472" class="request"/>
  <text x="380" y="445" text-anchor="middle" class="label">Full request + evidence + source IDs</text>

  <g id="application-specialist">
    <rect x="48" y="472" width="312" height="116" rx="12" fill="#fff" stroke="#8da6bb" stroke-width="1.5"/>
    <text x="70" y="508" class="heading">Application reviewer</text>
    <text x="70" y="537" class="tool">review_application</text>
    <text x="70" y="568" class="detail">Checks criteria + evidence</text>
  </g>
  <g id="case-specialist">
    <rect x="400" y="472" width="312" height="116" rx="12" fill="#fff" stroke="#8da6bb" stroke-width="1.5"/>
    <text x="422" y="508" class="heading">Case reviewer</text>
    <text x="422" y="537" class="tool">review_case</text>
    <text x="422" y="568" class="detail">Finds gaps + conflicts</text>
  </g>
  <path d="M204 588V622H380V652" class="result"/>
  <path d="M556 588V622H380" fill="none" stroke="#00786a" stroke-width="2.5"/>
  <text x="380" y="611" text-anchor="middle" class="label">Completed, nonempty responses</text>

  <g id="coordinator-result">
    <rect x="120" y="652" width="520" height="82" rx="12" fill="#edf7f4" stroke="#00786a" stroke-width="1.5"/>
    <text x="146" y="687" class="heading">Same coordinator returns findings</text>
    <text x="146" y="717" class="detail">Tool record: status, agent, output</text>
  </g>
  <path d="M380 734V800" class="result"/>
  <text x="402" y="783" class="label">Answer + tool record</text>

  <g id="human-review">
    <rect x="48" y="800" width="664" height="112" rx="12" fill="#f5f7fa" stroke="#aebdcb" stroke-width="1.5"/>
    <text x="70" y="838" class="heading">3  Review the answer in the Lab</text>
    <text x="70" y="869" class="detail">The Lab checks tool records; a person checks the evidence.</text>
    <text x="70" y="898" class="detail">No automatic approval, denial, or external action.</text>
  </g>

  <rect x="24" y="920" width="712" height="40" rx="6" fill="#fff4ce"/>
  <text x="380" y="947" text-anchor="middle" class="label">Unclear request? Ask for details. Failed call? Report the failure.</text>
</svg>
