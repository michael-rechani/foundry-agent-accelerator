name: Owned process prototype only
on:
  push:
    branches: [michael-rechani-owned-process-prototype]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Check Ruff availability
        run: |
          if python -m ruff --version; then
            echo "Ruff is already installed"
          else
            python -c "import importlib.util; assert importlib.util.find_spec('ruff') is None"
            python -m pip install -r .github/requirements-validation.txt
          fi
      - name: Lint prototype
        run: python -m ruff check --config ruff.toml .github/scripts/owned_process.py .github/scripts/test_owned_process.py
      - name: Run focused synthetic tests
        working-directory: .github/scripts
        run: python -m unittest test_owned_process test_check_foundry_prerequisites.ProcessTests test_check_foundry_prerequisites.ProcessRetentionTests test_check_foundry_prerequisites.CleanupTests test_check_foundry_prerequisites.FailureStageTests -v
