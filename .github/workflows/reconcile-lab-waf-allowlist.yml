name: Reconcile private Lab WAF allow-list input

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect only, or pin the reviewed live allow-list entries into the private inputs
        type: choice
        required: true
        default: inspect
        options: [inspect, pin-live-allowlist]
      expected_missing:
        description: Reviewed count of live entries missing from the inputs (1 to 10); required to pin
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-state-access
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: [self-hosted, linux, lab-runner]
    environment: terraform-state
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Inspect or pin the live allow-list
        env:
          TF_LAB_PLAN_CONFIG: ${{ secrets.TF_LAB_PLAN_CONFIG }}
          TF_LAB_WAF_OPERATION: ${{ inputs.operation }}
          TF_LAB_WAF_EXPECTED_MISSING: ${{ inputs.expected_missing }}
        run: python3 .github/scripts/reconcile_lab_waf_allowlist.py
      - name: Remove this run's private inputs and provider scratch
        if: always()
        run: python3 .github/scripts/reconcile_lab_waf_allowlist.py --cleanup
