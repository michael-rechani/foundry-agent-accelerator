name: Apply reviewed private Lab Terraform changes

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check what the guarded apply would do, or apply the reviewed change set
        type: choice
        required: true
        default: check
        options: [check, apply]

permissions:
  contents: read

concurrency:
  group: terraform-state-access
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    runs-on: [self-hosted, linux, lab-runner]
    environment: terraform-state
    # An image rollout must not interleave with this apply: a stale plan could revert the image.
    concurrency:
      group: deploy-lab
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Check or apply the reviewed Lab change set
        env:
          TF_LAB_PLAN_CONFIG: ${{ secrets.TF_LAB_PLAN_CONFIG }}
          TF_LAB_APPLY_OPERATION: ${{ inputs.operation }}
        run: python3 .github/scripts/apply_lab_terraform.py
      - name: Remove this run's private inputs and provider scratch
        if: always()
        run: python3 .github/scripts/apply_lab_terraform.py --cleanup
