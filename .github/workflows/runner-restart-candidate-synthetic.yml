name: Runner restart candidate synthetic
on:
  push:
    branches: [michael-rechani-runner-restart-safeguards]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test restart inputs without network, credentials, or privileged tools
        working-directory: .github/scripts
        run: |
          test "$(id -u)" -ne 0
          python3 -m unittest -v test_check_runner_restart_candidate
