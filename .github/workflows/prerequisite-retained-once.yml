name: Retained prerequisite synthetic checks

on:
  push:
    branches:
      - copilot/retained-prerequisite-20261107

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run non-root fictional checks
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          /usr/bin/env -i \
            "PATH=/usr/bin:/bin" \
            "HOME=$RUNNER_TEMP" \
            "LANG=C" \
            "PYTHONPATH=$GITHUB_WORKSPACE/.github/scripts" \
            "RUNNER_TRACKING_ID=${RUNNER_TRACKING_ID:-}" \
            /usr/bin/python3 -m unittest -v \
              test_check_foundry_prerequisites \
              test_check_foundry_prerequisites_retained
