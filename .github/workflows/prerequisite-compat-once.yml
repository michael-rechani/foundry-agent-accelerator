name: Retained prerequisite compatibility

on:
  push:
    branches:
      - copilot/retained-prerequisite-tracking-20261107

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Check targeted lint and fictional behavior
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          python -m venv "$RUNNER_TEMP/compat-venv"
          venv="$RUNNER_TEMP/compat-venv/bin"
          if ! "$venv/python" -m ruff --version; then
            /usr/bin/env -i \
              "PATH=$venv:/usr/bin:/bin" "HOME=$RUNNER_TEMP" \
              "PIP_CONFIG_FILE=/dev/null" "PIP_DISABLE_PIP_VERSION_CHECK=1" \
              "$venv/python" -m pip install --no-input ruff==0.17.3
          fi
          /usr/bin/env -i \
            "PATH=$venv:/usr/bin:/bin" "HOME=$RUNNER_TEMP" "LANG=C" \
            "PYTHONPATH=$GITHUB_WORKSPACE/.github/scripts" \
            "RUNNER_TRACKING_ID=${RUNNER_TRACKING_ID:-}" \
            "$venv/python" -m ruff check \
              .github/scripts/check_foundry_prerequisites_retained.py \
              .github/scripts/test_check_foundry_prerequisites_retained.py
          /usr/bin/env -i \
            "PATH=$venv:/usr/bin:/bin" "HOME=$RUNNER_TEMP" "LANG=C" \
            "PYTHONPATH=$GITHUB_WORKSPACE/.github/scripts" \
            "RUNNER_TRACKING_ID=${RUNNER_TRACKING_ID:-}" \
            "$venv/python" -m unittest \
              test_check_foundry_prerequisites \
              test_check_foundry_prerequisites_retained
