name: Check platform plan OIDC claims

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: platform-plan-oidc-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on: [self-hosted, linux, lab-runner]
    environment: platform-plan-read
    permissions:
      id-token: write
    steps:
      - name: Verify the plan environment's OIDC claims
        env:
          VERIFIED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VERIFIED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python3 -I - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import time
          from urllib import parse, request

          REPOSITORY = "michael-rechani/foundry-agent-accelerator"
          ENVIRONMENT = "platform-plan-read"
          AUDIENCE = "api://AzureADTokenExchange"
          ISSUER = "https://token.actions.githubusercontent.com"
          REPOSITORY_URL = "https://api.github.com/repos/" + REPOSITORY

          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def strict_object(raw):
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("Duplicate JSON key")
                      result[key] = value
                  return result

              def invalid_constant(value):
                  raise ValueError("Invalid JSON number")

              value = json.loads(raw, object_pairs_hook=unique, parse_constant=invalid_constant)
              if not isinstance(value, dict):
                  raise ValueError("Expected a JSON object")
              return value

          def verify_context(env):
              sha = env.get("GITHUB_SHA", "")
              if (env.get("GITHUB_REPOSITORY") != REPOSITORY
                      or env.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                      or env.get("GITHUB_REF") != "refs/heads/main"
                      or not re.fullmatch(r"[0-9a-f]{40}", sha)
                      or env.get("VERIFIED_WORKFLOW_SHA") != sha
                      or env.get("VERIFIED_WORKFLOW_REF") != REPOSITORY + "/.github/workflows/"
                      "check-platform-plan-federation.yml@refs/heads/main"):
                  raise ValueError("Invalid execution context")

          def read_json(opener, url, headers, limit):
              req = request.Request(url, headers=headers, method="GET")
              with opener.open(req, timeout=15) as response:
                  if response.status != 200 or response.geturl() != url:
                      raise ValueError("Unexpected HTTPS response")
                  body = response.read(limit + 1)
              if len(body) > limit:
                  raise ValueError("Response too large")
              return strict_object(body)

          def repository_ids(opener):
              obj = read_json(opener, REPOSITORY_URL, {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "platform-plan-oidc-check",
              }, 131072)
              owner = obj.get("owner")
              repo_id = obj.get("id")
              if (obj.get("full_name") != REPOSITORY or not isinstance(owner, dict)
                      or owner.get("login") != REPOSITORY.split("/", 1)[0]
                      or type(repo_id) is not int or repo_id <= 0
                      or type(owner.get("id")) is not int or owner["id"] <= 0):
                  raise ValueError("Unexpected repository metadata")
              return str(owner["id"]), str(repo_id)

          def request_assertion(opener, env):
              raw = env.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
              bearer = env.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
              if (not isinstance(raw, str) or not raw or len(raw) > 16384
                      or not isinstance(bearer, str) or not bearer or len(bearer) > 16384
                      or "\r" in bearer or "\n" in bearer):
                  raise ValueError("Invalid OIDC request")
              url = parse.urlsplit(raw)
              host = url.hostname or ""
              if (url.scheme != "https" or not re.fullmatch(
                      r"(?:[a-z0-9-]+\.)+actions\.githubusercontent\.com", host)
                      or url.username or url.password or url.port not in (None, 443)
                      or url.fragment or not url.path):
                  raise ValueError("Invalid OIDC endpoint")
              query = [(key, value) for key, value in parse.parse_qsl(
                  url.query, keep_blank_values=True, max_num_fields=100) if key != "audience"]
              query.append(("audience", AUDIENCE))
              target = parse.urlunsplit(url._replace(query=parse.urlencode(query)))
              obj = read_json(opener, target, {
                  "Authorization": "Bearer " + bearer,
                  "Accept": "application/json",
              }, 65536)
              assertion = obj.get("value")
              if not isinstance(assertion, str) or not assertion or len(assertion) > 16384:
                  raise ValueError("Invalid OIDC assertion")
              return assertion

          def decode_claims(assertion):
              if not isinstance(assertion, str) or len(assertion) > 16384:
                  raise ValueError("Invalid JWT")
              parts = assertion.split(".")
              if len(parts) != 3 or any(not re.fullmatch(r"[A-Za-z0-9_-]+", part) for part in parts):
                  raise ValueError("Invalid JWT")
              payload = base64.b64decode(parts[1] + "=" * (-len(parts[1]) % 4),
                                         altchars=b"-_", validate=True)
              if len(payload) > 8192:
                  raise ValueError("JWT payload too large")
              return strict_object(payload)

          def classify_claims(claims, owner_id, repo_id, now):
              owner, repo = REPOSITORY.split("/", 1)
              immutable = f"repo:{owner}@{owner_id}/{repo}@{repo_id}:environment:{ENVIRONMENT}"
              legacy = f"repo:{REPOSITORY}:environment:{ENVIRONMENT}"
              subject = claims.get("sub")
              subject_kind = "id_qualified" if subject == immutable else "name_only" if subject == legacy else "unexpected"
              binding = (claims.get("repository") == REPOSITORY
                         and claims.get("repository_owner_id") == owner_id
                         and claims.get("repository_id") == repo_id
                         and claims.get("ref") == "refs/heads/main"
                         and claims.get("environment") == ENVIRONMENT
                         and claims.get("event_name") == "workflow_dispatch")
              expiry, not_before = claims.get("exp"), claims.get("nbf")
              lifetime = (type(expiry) is int and expiry > now
                          and (not_before is None or type(not_before) is int and not_before <= now + 60))
              return claims.get("iss") == ISSUER, claims.get("aud") == AUDIENCE, subject_kind, binding, lifetime

          def main(env=os.environ):
              try:
                  verify_context(env)
              except (ValueError, TypeError):
                  print("plan_oidc_check_failed=context", file=sys.stderr)
                  return 1
              opener = request.build_opener(request.ProxyHandler({}), NoRedirect())
              try:
                  owner_id, repo_id = repository_ids(opener)
              except (OSError, ValueError, TypeError):
                  print("plan_oidc_check_failed=repository_lookup", file=sys.stderr)
                  return 1
              try:
                  assertion = request_assertion(opener, env)
              except (OSError, ValueError, TypeError):
                  print("plan_oidc_check_failed=token_request", file=sys.stderr)
                  return 1
              try:
                  claims = decode_claims(assertion)
              except (ValueError, TypeError):
                  print("plan_oidc_check_failed=token_invalid", file=sys.stderr)
                  return 1
              issuer, audience, subject, binding, lifetime = classify_claims(
                  claims, owner_id, repo_id, int(time.time()))
              print("plan_oidc_issuer=matched" if issuer else "plan_oidc_issuer=mismatched")
              print("plan_oidc_audience=matched" if audience else "plan_oidc_audience=mismatched")
              if subject == "id_qualified":
                  print("plan_oidc_subject=id_qualified")
              elif subject == "name_only":
                  print("plan_oidc_subject=name_only")
              else:
                  print("plan_oidc_subject=unexpected")
              print("plan_oidc_binding=matched" if binding else "plan_oidc_binding=mismatched")
              print("plan_oidc_lifetime=valid" if lifetime else "plan_oidc_lifetime=invalid")
              return 0 if issuer and audience and subject == "id_qualified" and binding and lifetime else 1

          if __name__ == "__main__":
              try:
                  status = main()
              except BaseException:
                  print("plan_oidc_check_failed=unexpected", file=sys.stderr)
                  raise SystemExit(1) from None
              raise SystemExit(status)
          PY
