name: Temporary owned-process atomic-launch blocker checks

on:
  push:
    branches: [michael-rechani-owned-process-atomic-launch-blocker]

permissions:
  contents: read

jobs:
  focused-owned-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Require unprivileged test identity
        run: |
          test "$(id -u)" -ne 0
          python --version
      - name: Check for existing Ruff before installing a missing tool
        run: |
          set +e
          python -m ruff --version > .owned-process-ruff-probe 2>&1
          status=$?
          set -e
          cat .owned-process-ruff-probe
          if [ "$status" -ne 0 ]; then
            grep -q 'No module named ruff' .owned-process-ruff-probe
            python -m pip install -r .github/requirements-validation.txt
          fi
          rm .owned-process-ruff-probe
          test "$(python -m ruff --version)" = "ruff 0.17.3"
      - name: Check exact prototype and unchanged prerequisite files
        run: |
          python -m ruff check --config ruff.toml .github/scripts/owned_process.py .github/scripts/test_owned_process.py .github/scripts/check_foundry_prerequisites.py .github/scripts/test_check_foundry_prerequisites.py
      - name: Run only revised prototype and disabled-launcher selectors
        working-directory: .github/scripts
        run: |
          python -m unittest -v test_owned_process test_check_foundry_prerequisites.ProcessTests test_check_foundry_prerequisites.ProcessRetentionTests test_check_foundry_prerequisites.CleanupTests test_check_foundry_prerequisites.FailureStageTests
