name: Temporary fictional promotion regression v3
on:
  push:
    branches:
      - michael-rechani-candidate-enabled-state
    paths:
      - .github/workflows/offline-sdk-response-check.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Restore only missing pinned dependencies
        id: dependencies
        run: |
          if ! python -c 'from importlib.metadata import version; assert version("azure-ai-projects") == "2.6.1"; assert version("azure-identity") == "1.27.0"; assert version("openai") == "3.41.0"; import azure.ai.projects, requests, httpx2'; then
            echo 'Required pinned deployment dependencies are missing'
            python -m pip install -r hosted-agents/review-coordinator-agent/requirements-deploy.txt
          fi
          if ! python -m ruff --version || ! python -c 'from importlib.metadata import version; assert version("ruff") == "0.17.3"'; then
            echo 'Required pinned Ruff is missing'
            python -m pip install -r .github/requirements-validation.txt
          fi
          python -c 'from importlib.metadata import version; assert version("azure-ai-projects") == "2.6.1"; assert version("azure-identity") == "1.27.0"; assert version("openai") == "3.41.0"; assert version("ruff") == "0.17.3"'
      - name: Run fictional deployment regressions
        working-directory: hosted-agents
        run: python -m unittest -v test_candidate_smoke test_deployment test_deployment_sdk
      - name: Run repository Ruff configuration
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff check hosted-agents/deployment.py hosted-agents/test_candidate_smoke.py hosted-agents/test_deployment.py hosted-agents/test_deployment_sdk.py
