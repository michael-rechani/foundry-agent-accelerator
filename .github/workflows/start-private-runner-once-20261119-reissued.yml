name: Start private runner once 20261119 (reissued)

# This is one owner-authorized wake, not independent review. Dispatch only
# after reviewing and merging this workflow and the current main validation.
# It uses the existing lab-deploy principal, which also has Lab/ACR rights.
# The workflow never deploys the Lab. The first run/attempt is the only use.
on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Reviewed protected main commit SHA (40 lowercase hex characters)
        required: true
        type: string
      reviewed_vm_sha256:
        description: Reviewed SHA-256 of the configured VM ARM ID (lowercase, no newline)
        required: true
        default: 40b50a1431fa35321ab3ab61c23f5ca381f0952a013720db7dbd03ee038f9ca8
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: start-private-runner
  cancel-in-progress: false

jobs:
  start-runner:
    if: github.repository_owner == 'michael-rechani' && github.actor_id == '97264614' && github.repository == 'michael-rechani/foundry-agent-accelerator' && github.workflow_ref == 'michael-rechani/foundry-agent-accelerator/.github/workflows/start-private-runner-once-20261119-reissued.yml@refs/heads/main' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.reviewed_main_sha == github.sha && github.run_number == 1 && github.run_attempt == 1
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: lab-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      LAB_RUNNER_VM: ${{ vars.LAB_RUNNER_VM }}
      LAB_RUNNER_RESOURCE_GROUP: ${{ vars.LAB_RUNNER_RESOURCE_GROUP }}
      REVIEWED_VM_SHA256: ${{ inputs.reviewed_vm_sha256 }}
      REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
      GH_TOKEN: ${{ github.token }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate owner authorization, queue and exact target; start at most once
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$GITHUB_REPOSITORY_OWNER" == "michael-rechani" ]] || fail "Unexpected repository owner."
          [[ "${GITHUB_ACTOR_ID:-}" == "97264614" ]] || fail "Unexpected owner dispatch actor."
          [[ "$GITHUB_REPOSITORY" == "michael-rechani/foundry-agent-accelerator" ]] || fail "Unexpected repository."
          [[ "$GITHUB_WORKFLOW_REF" == "michael-rechani/foundry-agent-accelerator/.github/workflows/start-private-runner-once-20261119-reissued.yml@refs/heads/main" ]] || fail "Unexpected workflow source."
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || fail "Unexpected ref or event."
          [[ "$RUN_NUMBER" == "1" && "$RUN_ATTEMPT" == "1" ]] || fail "One-shot authorization consumed; a new reviewed workflow is required."
          [[ "$REVIEWED_MAIN_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$REVIEWED_MAIN_SHA" ]] || fail "Workflow SHA differs from the reviewed main commit."
          [[ "$REVIEWED_VM_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid reviewed VM fingerprint."
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_MAIN_SHA" ]] || fail "Checked-out source differs from the reviewed main commit."
          [[ -n "${GH_TOKEN:-}" ]] || fail "GitHub token is missing."
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          [[ "$AZURE_SUBSCRIPTION_ID" =~ ^${uuid}$ ]] || fail "Invalid configured subscription ID."
          [[ "$AZURE_CLIENT_ID" =~ ^${uuid}$ ]] || fail "Invalid configured client ID."
          [[ "$AZURE_TENANT_ID" =~ ^${uuid}$ ]] || fail "Invalid configured tenant ID."
          [[ "$LAB_RUNNER_RESOURCE_GROUP" =~ ^[A-Za-z0-9_-][A-Za-z0-9_.-]{0,89}$ ]] || fail "Invalid configured resource group."
          [[ "$LAB_RUNNER_VM" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || fail "Invalid configured VM name."
          expected_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$LAB_RUNNER_RESOURCE_GROUP/providers/Microsoft.Compute/virtualMachines/$LAB_RUNNER_VM"
          expected_sha256="$(printf '%s' "${expected_id,,}" | sha256sum)"
          expected_sha256="${expected_sha256%% *}"
          [[ "$REVIEWED_VM_SHA256" == "$expected_sha256" ]] || fail "Configured VM fingerprint differs from the reviewed target."
          for value in "$AZURE_SUBSCRIPTION_ID" "$LAB_RUNNER_RESOURCE_GROUP" "$LAB_RUNNER_VM" \
            "$expected_id" "${expected_id,,}" "$AZURE_CLIENT_ID" "$AZURE_TENANT_ID"; do
            echo "::add-mask::$value"
          done

          branch_response="$(curl --disable --silent --show-error --max-time 30 --max-redirs 0 --proto '=https' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --write-out '\n%{http_code}' \
            'https://api.github.com/repos/michael-rechani/foundry-agent-accelerator/branches/main')" || fail "Main branch verification request failed."
          http_status="${branch_response##*$'\n'}"
          branch_body="${branch_response%$'\n'*}"
          [[ "$http_status" == "200" ]] || fail "Main branch verification returned a non-200 response."
          jq -e -s --arg sha "$REVIEWED_MAIN_SHA" \
            'length == 1 and (.[0] | type == "object" and .name == "main" and .protected == true and (.commit | type == "object" and .sha == $sha))' \
            <<< "$branch_body" >/dev/null || fail "Main branch is unprotected, moved, or returned malformed data."
          unset branch_response branch_body

          python3 .github/scripts/check_lab_runner_queue.py || fail "Active runner queue could not be verified as clear."

          token="$(curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -er '.value | select(type == "string" and length > 0)')" || fail "OIDC token request failed."
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" --allow-no-subscriptions --output none || fail "Azure authentication failed."
          unset token
          az account set --subscription "$AZURE_SUBSCRIPTION_ID" || fail "Azure subscription selection failed."

          actual_id="$(az vm show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$LAB_RUNNER_RESOURCE_GROUP" --name "$LAB_RUNNER_VM" --query id --output tsv)" || fail "Azure VM identity read failed."
          [[ "${actual_id,,}" == "${expected_id,,}" ]] || fail "Azure VM ID differs from the configured and reviewed target."
          echo "::add-mask::$actual_id"
          power_state() {
            az vm get-instance-view --ids "$actual_id" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" --output tsv
          }
          state="$(power_state)" || fail "Azure VM power-state read failed."
          case "$state" in
            PowerState/running|PowerState/starting) ;;
            PowerState/stopped|PowerState/deallocated)
              python3 .github/scripts/check_lab_runner_queue.py || fail "Active runner queue changed before VM start."
              az vm start --ids "$actual_id" --no-wait --output none || fail "Azure VM start failed." ;;
            *) fail "VM power state is missing or not safe to start." ;;
          esac
          deadline=$((SECONDS + 300))
          until [[ "$state" == "PowerState/running" ]]; do
            (( SECONDS < deadline )) || fail "VM did not become running within five minutes."
            sleep 10
            state="$(power_state)" || fail "Azure VM power-state confirmation failed."
            case "$state" in
              PowerState/running|PowerState/starting) ;;
              *) fail "VM entered an unexpected state; no start retry will be attempted." ;;
            esac
          done
          echo "Private runner VM confirmed running." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: start-runner
    if: github.repository_owner == 'michael-rechani' && github.actor_id == '97264614' && github.repository == 'michael-rechani/foundry-agent-accelerator' && github.workflow_ref == 'michael-rechani/foundry-agent-accelerator/.github/workflows/start-private-runner-once-20261119-reissued.yml@refs/heads/main' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.reviewed_main_sha == github.sha && github.run_number == 1 && github.run_attempt == 1
    timeout-minutes: 2
    runs-on: [self-hosted, linux, lab-runner]
    permissions: {}
    steps:
      - name: Report only the runner registration that executed this job
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner registration: %s\n' "$RUNNER_NAME"
          printf 'Runner registration: %s\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
