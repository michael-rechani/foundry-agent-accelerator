name: Diagnose private Lab Terraform plan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-state-access
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: [self-hosted, linux, lab-runner]
    environment: terraform-state
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Produce a redacted full-root Lab plan
        env:
          TF_LAB_PLAN_CONFIG: ${{ secrets.TF_LAB_PLAN_CONFIG }}
        run: python3 .github/scripts/check_lab_terraform_plan.py
      - name: Remove this run's private plans, inputs and provider scratch
        if: always()
        run: python3 .github/scripts/check_lab_terraform_plan.py --cleanup
