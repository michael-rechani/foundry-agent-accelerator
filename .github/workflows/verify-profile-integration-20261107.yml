name: Profile and private verification integration

on:
  push:
    branches: [copilot/rollout-verification-integration-20261107]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run fictional verification and profile contract tests
        env:
          PYTHONPATH: workbench
        run: |
          python3 -m unittest test_verify_private test_profile_verification_contract
          python3 -m unittest discover -s hosted-agents/review-coordinator-agent -p test_profiles.py
