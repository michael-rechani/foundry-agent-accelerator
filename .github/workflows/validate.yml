name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan every commit for credentials
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1

  python-tests:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            hosted-agents/*/requirements*.txt
            workbench/requirements.txt
            workbench/agent_runtime/requirements.txt
            .github/requirements-validation.txt
      - name: Upgrade pip
        run: python -m pip install "pip>=26.2,<27"
      - name: Install deployment dependencies
        run: >-
          python -m pip install
          -r hosted-agents/basic-responses-agent/requirements-deploy.txt
          -r hosted-agents/case-review-agent/requirements-deploy.txt
          -r hosted-agents/application-review-agent/requirements-deploy.txt
          -r hosted-agents/review-coordinator-agent/requirements-deploy.txt
      - name: Install hosted runtime dependencies
        run: >-
          python -m pip install
          -r hosted-agents/basic-responses-agent/requirements.txt
          -r hosted-agents/case-review-agent/requirements.txt
          -r hosted-agents/application-review-agent/requirements.txt
          -r hosted-agents/review-coordinator-agent/requirements.txt
          -r workbench/agent_runtime/requirements.txt
      - name: Install workbench dependencies
        run: python -m pip install -r workbench/requirements.txt
      - name: Check combined dependency compatibility
        run: python -m pip check
      - name: Check Python correctness
        run: |
          python -m pip install -r .github/requirements-validation.txt
          python -m ruff check cost-comparison hosted-agents workbench evaluations
      - name: Test agent creation, runtime, chat, history, and review APIs
        run: python -m unittest discover -s workbench -p 'test_*.py' -v
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --progress-spinner off
      - name: Compile Python sources
        run: python -m compileall -q cost-comparison hosted-agents workbench/app.py workbench/history.py workbench/reviews.py workbench/review_runs.py workbench/agent_creation.py workbench/agent_publisher.py workbench/agent_package.py workbench/agent_templates.py workbench/agent_runtime workbench/verify_private.py
      - name: Test cost calculator
        run: python cost-comparison/test_calculator.py
      - name: Test deployment packaging
        run: python -m unittest discover -s hosted-agents -p 'test_*.py' -v
      - name: Test coordinator and real SDK contracts
        run: python -m unittest discover -s hosted-agents/review-coordinator-agent -p 'test_*.py' -v
      - name: Validate example agent profile without Azure
        run: python hosted-agents/review-coordinator-agent/deploy.py --profile hosted-agents/review-coordinator-agent/profiles/evidence-review.example.json --validate-profile
      - name: Validate deployment CLIs
        run: |
          python hosted-agents/basic-responses-agent/deploy.py --help
          python hosted-agents/case-review-agent/deploy.py --help
          python hosted-agents/application-review-agent/deploy.py --help
          python hosted-agents/review-coordinator-agent/deploy.py --help
      - name: Validate hosted runtime imports
        run: >-
          python -c "from agent_framework import Agent;
          from agent_framework.foundry import FoundryChatClient;
          from agent_framework_foundry_hosting import ResponsesHostServer"

  python:
    needs: python-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require both Python versions to pass
        env:
          MATRIX_RESULT: ${{ needs.python-tests.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Python matrix did not succeed: $MATRIX_RESULT"
            exit 1
          fi

  evaluations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: evaluations/requirements.txt
      - name: Install isolated evaluation dependencies
        run: python -m pip install -r evaluations/requirements.txt
      - name: Check evaluation dependency compatibility
        run: python -m pip check
      - name: Test evaluation gates and offline SDK contracts
        run: python -m unittest discover -s evaluations -p 'test_*.py' -v
      - name: Validate synthetic cases without Azure
        run: python evaluations/run.py

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Test publisher validation without Azure resources
        shell: pwsh
        run: ./terraform/test-publisher-validation.ps1
      - name: Test review API authorization and policy rendering
        shell: pwsh
        run: ./terraform/test-review-api-validation.ps1
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize without a backend
        run: terraform -chdir=terraform init -backend=false
      - name: Validate configuration
        run: terraform -chdir=terraform validate
      - name: Test platform inputs and retained-disk safeguards without Azure
        shell: pwsh
        run: ./terraform/test-platform-validation.ps1
      - name: Validate and test isolated Standard Bastion without Azure
        run: |
          terraform -chdir=terraform/bastion init -backend=false
          terraform -chdir=terraform/bastion validate
          terraform -chdir=terraform/bastion test
      - name: Validate and test private Foundry monitoring without Azure
        run: |
          terraform -chdir=terraform/monitoring init -backend=false
          terraform -chdir=terraform/monitoring validate
          terraform -chdir=terraform/monitoring test
      - name: Validate isolated workbench infrastructure
        run: |
          terraform -chdir=workbench/infra fmt -check
          terraform -chdir=workbench/infra init -backend=false
          terraform -chdir=workbench/infra validate
      - name: Test workbench deployment safeguards
        shell: pwsh
        run: ./workbench/test-deployment-inputs.ps1
      - name: Test monitoring and notification wiring without Azure
        shell: pwsh
        run: ./workbench/test-monitoring.ps1
      - name: Test private build and verification helpers without Azure or Docker
        shell: pwsh
        run: |
          ./workbench/test-build.ps1
          ./workbench/test-private-checks.ps1

  workbench-frontend:
    runs-on: ubuntu-24.04
    container: node:24.20.0-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm --prefix workbench/frontend ci
      - run: npm --prefix workbench/frontend run lint
      - run: npm --prefix workbench/frontend run format:check
      - name: Install browser and system dependencies
        run: npm --prefix workbench/frontend exec -- playwright install --with-deps chromium
      - name: Build and test desktop and mobile workflows
        run: npm --prefix workbench/frontend test