name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hosted-agents/*/requirements*.txt
      - name: Upgrade pip
        run: python -m pip install "pip>=26.2,<27"
      - name: Install deployment dependencies
        run: python -m pip install -r hosted-agents/basic-responses-agent/requirements-deploy.txt
      - name: Install hosted runtime dependencies
        run: python -m pip install -r hosted-agents/basic-responses-agent/requirements.txt -r hosted-agents/review-coordinator-agent/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --progress-spinner off
      - name: Compile Python sources
        run: python -m compileall -q cost-comparison hosted-agents
      - name: Test cost calculator
        run: python cost-comparison/test_calculator.py
      - name: Test deployment packaging
        run: python hosted-agents/test_deployment.py
      - name: Test coordinator and real SDK contracts
        run: python -m unittest discover -s hosted-agents/review-coordinator-agent -p 'test_*.py' -v
      - name: Validate deployment CLIs
        run: |
          python hosted-agents/basic-responses-agent/deploy.py --help
          python hosted-agents/case-review-agent/deploy.py --help
          python hosted-agents/application-review-agent/deploy.py --help
          python hosted-agents/review-coordinator-agent/deploy.py --help
      - name: Validate hosted runtime imports
        run: >-
          python -c "from agent_framework import Agent;
          from agent_framework.foundry import FoundryChatClient;
          from agent_framework_foundry_hosting import ResponsesHostServer"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Test publisher validation without Azure resources
        shell: pwsh
        run: ./terraform/test-publisher-validation.ps1
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize without a backend
        run: terraform -chdir=terraform init -backend=false
      - name: Validate configuration
        run: terraform -chdir=terraform validate