name: Deploy Lab image

# Explicitly dispatch a reviewed main commit after Validate succeeds and the
# separate platform, Lab, agent and recovery prerequisites have been reviewed.
# An approved way to bring the private runner online is still required.
on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      expected_current_image:
        description: Recorded current registry/workbench image with immutable sha256 digest
        required: true
        type: string
      confirm_rollout:
        description: Staged prerequisites and recovery inventory were separately reviewed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-lab
  cancel-in-progress: false

jobs:
  # This read-only job does not start the private runner or request Azure credentials.
  validate-source:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful validation for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          CONFIRM_ROLOUT: ${{ inputs.confirm_rollout }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$REVIEWED_SOURCE_SHA" == "$SOURCE_SHA" && "$CONFIRM_ROLLOUT" == "true" ]] || {
            echo "::error::Select the reviewed main commit and confirm the staged rollout inventory."
            exit 1
          }
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            runs="$(gh run list --repo "$REPOSITORY" --workflow validate.yml --branch main \
              --commit "$SOURCE_SHA" --limit 20 --json status,conclusion)"
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "Validate succeeded for $SOURCE_SHA."
              exit 0
            fi
            active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            completed="$(jq '[.[] | select(.status == "completed")] | length' <<<"$runs")"
            if (( completed > 0 && active == 0 )); then
              echo "::error::Validate did not succeed for $SOURCE_SHA."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for Validate to succeed for $SOURCE_SHA."
          exit 1

  deploy:
    needs: validate-source
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: [self-hosted, linux, lab-runner]
    environment: lab-deploy
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LAB_REGISTRY: ${{ vars.LAB_REGISTRY }}
      LAB_CONTAINER_APP: ${{ vars.LAB_CONTAINER_APP }}
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
      EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
      CONFIRM_ROLLOUT: ${{ inputs.confirm_rollout }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the reviewed dispatch and current main
        run: python3 .github/scripts/check_lab_image_release.py
      # The private runner has Docker but no Azure CLI; keep its sign-in in job scratch.
      - name: Use the Azure CLI from Microsoft's image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/azconfig"
          docker pull --quiet mcr.microsoft.com/azure-cli:latest >/dev/null
          cat > "$RUNNER_TEMP/bin/az" <<EOF
          #!/bin/bash
          exec docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e AZURE_CONFIG_DIR=/azconfig \\
            -e AZURE_EXTENSION_USE_DYNAMIC_INSTALL=yes_without_prompt -e AZURE_EXTENSION_RUN_AFTER_DYNAMIC_INSTALL=false \\
            -v "$RUNNER_TEMP/azconfig:/azconfig" mcr.microsoft.com/azure-cli:latest az "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/az"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sign in to Azure with the GitHub token
        run: |
          set -euo pipefail
          token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Verify the current active Lab image
        run: bash .github/scripts/check_lab_live_image.sh
      - name: Build, check and push the image to the private registry
        run: |
          set -euo pipefail
          server="$(az acr show --name "$LAB_REGISTRY" --query loginServer --output tsv)"
          tag="${GITHUB_SHA::12}-r${GITHUB_RUN_ID}"
          image="${server}/workbench:${tag}"
          trap 'docker logout "$server" >/dev/null 2>&1 || true' EXIT
          acr_token="$(az acr login --name "$LAB_REGISTRY" --expose-token --output tsv --query accessToken)"
          echo "::add-mask::$acr_token"
          echo "$acr_token" | docker login "$server" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          # The context is allow-listed; this runner uses the classic linux/amd64 builder.
          docker build --pull --file workbench/Dockerfile --tag "$image" workbench
          docker run --rm --entrypoint python "$image" -c "import importlib, os; from pathlib import Path; [importlib.import_module(m.stem) for m in sorted(Path('.').glob('*.py'))]; import agent_publisher; assert os.getuid() != 0; assert agent_publisher.runtime_package()[0]; assert Path('agents.json').read_text(); assert Path('static/index.html').read_text()"
          bash .github/scripts/check_lab_live_image.sh
          docker push "$image"
          source="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          [[ "$source" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "Pushed image digest not found"; exit 1; }
          echo "IMAGE_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Roll the Container App to the new image
        run: |
          set -euo pipefail
          digest="sha256:${IMAGE_SOURCE##*@sha256:}"
          server="$(az acr show --name "$LAB_REGISTRY" --query loginServer --output tsv)"
          new_image="${server}/workbench@${digest}"
          bash .github/scripts/check_lab_live_image.sh
          previous="$EXPECTED_CURRENT_IMAGE"
          echo "Previous image: $previous"
          if [ "$previous" = "$new_image" ]; then echo "The Lab already runs this image."; exit 0; fi
          attempted="$(az containerapp update --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$new_image" --query 'properties.latestRevisionName' --output tsv)"
          [[ "$attempted" =~ ^[A-Za-z0-9-]+$ ]] || {
            echo "::error::The updated revision could not be identified. Inspect the live app before recovery."
            exit 1
          }
          ready=false
          for _ in $(seq 1 36); do
            latest="$(az containerapp show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.latestRevisionName' --output tsv)"
            ready_revision="$(az containerapp show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.latestReadyRevisionName' --output tsv)"
            if [ "$latest" != "$attempted" ]; then
              echo "::error::The latest revision changed during rollout. Inspect the live app before recovery."
              exit 1
            fi
            if [ "$attempted" = "$ready_revision" ]; then
              running="$(az containerapp revision show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$latest" --query 'properties.runningState' --output tsv)"
              if [[ "$running" == Running || "$running" == RunningAtMaxScale ]]; then
                if ! ATTEMPTED_REVISION="$attempted" ATTEMPTED_IMAGE="$new_image" \
                  bash .github/scripts/check_lab_live_image.sh --deployed; then
                  echo "::error::The deployed revision or image could not be verified. Inspect the app."
                  exit 1
                fi
                ready=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            if ! ATTEMPTED_REVISION="$attempted" ATTEMPTED_IMAGE="$new_image" \
              bash .github/scripts/check_lab_live_image.sh --recovery; then
              echo "::error::The new revision did not become healthy or recovery is ambiguous. Inspect the app."
              exit 1
            fi
            echo "::error::The new revision did not become healthy. Attempting to restore the recorded previous image."
            restored="$(az containerapp update --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$previous" --query 'properties.latestRevisionName' --output tsv)"
            if [[ ! "$restored" =~ ^[A-Za-z0-9-]+$ || "$restored" == "$attempted" ]]; then
              echo "::error::The recovery revision could not be identified. Inspect the app before retrying."
              exit 1
            fi
            recovered=false
            for _ in $(seq 1 36); do
              latest="$(az containerapp show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.latestRevisionName' --output tsv)"
              ready_revision="$(az containerapp show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.latestReadyRevisionName' --output tsv)"
              if [ "$latest" != "$restored" ]; then
                echo "::error::The latest revision changed during recovery. Inspect the app."
                exit 1
              fi
              if [ "$ready_revision" = "$restored" ]; then
                bash .github/scripts/check_lab_live_image.sh --restored
                recovered=true
                break
              fi
              sleep 10
            done
            if [ "$recovered" != true ]; then
              echo "::error::Recovery did not reach a verified running revision. Inspect the app."
            else
              echo "::error::The prior image is running again; application and agent response health still need verification."
            fi
            exit 1
          fi
          {
            echo "### Lab image deployed"
            echo ""
            echo "- Image digest: \`${digest}\`"
            echo "- Previous image (recovery): \`${previous}\`"
            echo ""
            echo "- Terraform ignores the container image after initial creation, so future applies will not roll it back."
          } >> "$GITHUB_STEP_SUMMARY"
