name: Deploy Lab image

# Builds the Lab image from main on the private runner, pushes it straight to the
# private registry, and rolls the Lab Container App to it by digest. It runs when a
# change to the Lab merges to main, and can also be started by hand from the Actions
# tab. One-time setup: terraform/identity creates the identity, its roles and this
# environment (see docs/lab-deployment.md).
#
# The registry has no public access. The runner reaches its private endpoint through the
# peered VNet, so nothing is published to GitHub Packages or anywhere public, and Azure
# holds no stored secret for this workflow. It runs only from main, and the lab-deploy
# environment gates the sign-in, so pull request code never reaches the runner.
on:
  push:
    branches: [main]
    paths:
      - 'workbench/**'
      - '!workbench/infra/**'
      - '!workbench/**/*.md'
      - '!workbench/frontend/tests/**'
      - '!workbench/test-deploy.ps1'
      - '!workbench/tests/fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lab
  cancel-in-progress: false

jobs:
  # The runner VM deallocates itself when idle to save cost, and nothing else starts it.
  # This job runs on a GitHub-hosted runner and starts only that VM. Its role can't stop,
  # change or run commands on the VM. Starting a running VM does nothing.
  start-runner:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    environment: lab-deploy
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      LAB_RUNNER_VM: ${{ vars.LAB_RUNNER_VM }}
      LAB_RUNNER_RESOURCE_GROUP: ${{ vars.LAB_RUNNER_RESOURCE_GROUP }}
    steps:
      - name: Sign in to Azure with the GitHub token
        run: |
          set -euo pipefail
          token="$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Start the runner VM
        run: |
          set -euo pipefail
          az vm start --name "$LAB_RUNNER_VM" --resource-group "$LAB_RUNNER_RESOURCE_GROUP" --output none
          echo "The runner VM is started. The build job starts when its runner comes online."

  deploy:
    needs: start-runner
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: [self-hosted, linux, lab-runner]
    environment: lab-deploy
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LAB_REGISTRY: ${{ vars.LAB_REGISTRY }}
      LAB_CONTAINER_APP: ${{ vars.LAB_CONTAINER_APP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The self-hosted runner has Docker but no Azure CLI, and the runner user can't install one.
      # This wrapper runs the same CLI from Microsoft's image, with its sign-in kept in the job's temp folder.
      - name: Use the Azure CLI from Microsoft's image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/azconfig"
          docker pull --quiet mcr.microsoft.com/azure-cli:latest >/dev/null
          cat > "$RUNNER_TEMP/bin/az" <<EOF
          #!/bin/bash
          exec docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e AZURE_CONFIG_DIR=/azconfig \\
            -e AZURE_EXTENSION_USE_DYNAMIC_INSTALL=yes_without_prompt -e AZURE_EXTENSION_RUN_AFTER_DYNAMIC_INSTALL=false \\
            -v "$RUNNER_TEMP/azconfig:/azconfig" mcr.microsoft.com/azure-cli:latest az "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/az"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sign in to Azure with the GitHub token
        run: |
          set -euo pipefail
          token="$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Build, check and push the image to the private registry
        run: |
          set -euo pipefail
          server="$(az acr show --name "$LAB_REGISTRY" --query loginServer --output tsv)"
          tag="${GITHUB_SHA::12}-r${GITHUB_RUN_ID}"
          image="${server}/workbench:${tag}"
          # The runner is persistent, so don't leave the registry login behind.
          trap 'docker logout "$server" >/dev/null 2>&1 || true' EXIT
          acr_token="$(az acr login --name "$LAB_REGISTRY" --expose-token --output tsv --query accessToken)"
          echo "::add-mask::$acr_token"
          echo "$acr_token" | docker login "$server" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          # .dockerignore is an allow-list, so this context matches what build.ps1 stages.
          # The runner is linux/amd64 and its Docker has no buildx plugin, so use the classic builder.
          docker build --pull --file workbench/Dockerfile --tag "$image" workbench
          docker run --rm --entrypoint python "$image" -c "import importlib, os; from pathlib import Path; [importlib.import_module(m.stem) for m in sorted(Path('.').glob('*.py'))]; import agent_publisher; assert os.getuid() != 0; assert agent_publisher.runtime_package()[0]; assert Path('agents.json').read_text(); assert Path('static/index.html').read_text()"
          docker push "$image"
          source="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          [[ "$source" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "Pushed image digest not found"; exit 1; }
          echo "IMAGE_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Roll the Container App to the new image
        run: |
          set -euo pipefail
          digest="sha256:${IMAGE_SOURCE##*@sha256:}"
          server="$(az acr show --name "$LAB_REGISTRY" --query loginServer --output tsv)"
          new_image="${server}/workbench@${digest}"
          previous="$(az containerapp show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.template.containers[0].image' --output tsv)"
          echo "Previous image: $previous"
          if [ "$previous" = "$new_image" ]; then echo "The Lab already runs this image."; exit 0; fi
          az containerapp update --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$new_image" --output none
          ready=false
          for _ in $(seq 1 36); do
            latest="$(az containerapp show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.latestRevisionName' --output tsv)"
            ready_revision="$(az containerapp show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.latestReadyRevisionName' --output tsv)"
            if [ "$latest" = "$ready_revision" ]; then
              running="$(az containerapp revision show --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$latest" --query 'properties.runningState' --output tsv)"
              if [[ "$running" == Running* ]]; then ready=true; break; fi
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::The new revision did not become healthy. Restoring the previous image."
            az containerapp update --name "$LAB_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$previous" --output none
            exit 1
          fi
          {
            echo "### Lab image deployed"
            echo ""
            echo "- Image digest: \`${digest}\`"
            echo "- Previous image (recovery): \`${previous}\`"
            echo ""
            echo "Terraform still has the old digest. Before the next \`terraform apply\`, set \`image_digest\` in"
            echo "\`workbench/infra/image.auto.tfvars\` to the digest above, or the apply will roll this back."
          } >> "$GITHUB_STEP_SUMMARY"
