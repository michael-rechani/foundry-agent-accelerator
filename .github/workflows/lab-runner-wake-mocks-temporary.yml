name: Lab runner wake mocks (temporary)

on:
  push:
    branches:
      - michael-rechani-lab-image-release-safeguards

permissions:
  contents: read

jobs:
  mocked-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run focused mocked contract tests
        run: |
          python3 .github/scripts/test_check_lab_image_approval.py -v
          python3 .github/scripts/test_check_lab_runner_queue.py -v
          python3 .github/scripts/test_start_private_runner_once_20261119.py -v
