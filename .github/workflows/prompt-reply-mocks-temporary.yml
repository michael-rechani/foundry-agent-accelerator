name: Prompt reply mocks (temporary)
on:
  push:
    branches: [michael-rechani-polish-prompt-replies]
permissions:
  contents: read
jobs:
  prompt-reply-mocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run mock prompt creation, runtime, and chat tests
        run: |
          if ! python -c "import fastapi, azure.cosmos, agent_framework.foundry"; then
            python -m pip install -r requirements.txt -r agent_runtime/requirements.txt
          fi
          python -m unittest -v test_agent_creation test_agent_runtime test_design_loop test_app
