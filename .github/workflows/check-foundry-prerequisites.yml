name: Check isolated private Foundry prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-foundry-prerequisites
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    timeout-minutes: 10
    runs-on: [self-hosted, linux, lab-runner]
    environment: terraform-state
    permissions:
      contents: read
    env:
      PATH: /usr/local/bin:/usr/bin:/bin
      BASH_ENV: /dev/null
      ENV: /dev/null
    defaults:
      run:
        shell: bash
    steps:
      - name: Reserve this run's exclusive source directory
        id: source
        run: |
          set +x
          set -euo pipefail
          umask 077
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "prerequisite_run_context_invalid" >&2
            exit 1
          fi
          source_dir="foundry-prerequisite-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! mkdir -- "$source_dir" 2>/dev/null; then
            echo "prerequisite_source_reservation_failed" >&2
            exit 1
          fi
          reserved=false
          trap 'if [[ "$reserved" != true ]]; then rm -rf -- "$source_dir" >/dev/null 2>&1; fi' EXIT
          trap 'exit 1' INT TERM
          if ! printf '%s\n' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" 2>/dev/null > "$source_dir/.run-owned"; then
            echo "prerequisite_source_reservation_failed" >&2
            exit 1
          fi
          reserved=true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
          show-progress: false
          path: foundry-prerequisite-source-${{ github.run_id }}-${{ github.run_attempt }}/checkout
          sparse-checkout: .github/scripts/check_foundry_prerequisites.py
          sparse-checkout-cone-mode: false
      - name: Check the actual pinned skill with isolated tool state
        run: |
          set +x
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "prerequisite_run_context_invalid" >&2
            exit 1
          fi
          if result="$(/usr/bin/env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            GITHUB_REF="${GITHUB_REF:-}" \
            GITHUB_REF_PROTECTED="${GITHUB_REF_PROTECTED:-}" \
            GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_TEMP="${RUNNER_TEMP:-}" \
            python3 -I "foundry-prerequisite-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/checkout/.github/scripts/check_foundry_prerequisites.py" 2>/dev/null)"; then
            if [[ "$result" =~ ^azd_version=[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$'\n'foundry_prerequisites=ready$ ]]; then
              printf '%s\n' "$result"
              exit 0
            fi
            result="failure_stage=launcher"
          fi
          case "$result" in
            failure_stage=context|failure_stage=download|failure_stage=checksum|failure_stage=archive|failure_stage=missing_bash|failure_stage=skill_execution|failure_stage=version|failure_stage=cleanup|failure_stage=timeout|failure_stage=interruption|failure_stage=unexpected_io|failure_stage=launcher)
              printf '%s\n' "$result" ;;
            *) echo "failure_stage=launcher" ;;
          esac
          echo "foundry_prerequisites_check_failed" >&2
          exit 1
      - name: Remove only this run's scratch and source
        if: always() && steps.source.outcome == 'success'
        run: |
          set +x
          set -uo pipefail
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "prerequisite_run_context_invalid" >&2
            exit 1
          fi
          source_dir="foundry-prerequisite-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          script="$source_dir/checkout/.github/scripts/check_foundry_prerequisites.py"
          status=0
          if [[ -f "$script" ]]; then
            if result="$(/usr/bin/env -i \
              PATH=/usr/local/bin:/usr/bin:/bin \
              GITHUB_REF="${GITHUB_REF:-}" \
              GITHUB_REF_PROTECTED="${GITHUB_REF_PROTECTED:-}" \
              GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
              GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              RUNNER_TEMP="${RUNNER_TEMP:-}" \
              python3 -I "$script" --cleanup 2>/dev/null)"; then
              if [[ "$result" == foundry_prerequisites_cleanup=complete ]]; then
                echo "foundry_prerequisites_cleanup=complete"
              else
                echo "failure_stage=launcher"
                status=1
              fi
            else
              case "$result" in
                failure_stage=context|failure_stage=download|failure_stage=checksum|failure_stage=archive|failure_stage=missing_bash|failure_stage=skill_execution|failure_stage=version|failure_stage=cleanup|failure_stage=timeout|failure_stage=interruption|failure_stage=unexpected_io)
                  printf '%s\n' "$result" ;;
                *) echo "failure_stage=launcher" ;;
              esac
              status=1
            fi
          fi
          if [[ ! -L "$source_dir" && -d "$source_dir" && ! -L "$source_dir/.run-owned" ]] &&
             [[ "$(cat "$source_dir/.run-owned" 2>/dev/null)" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]; then
            rm -rf -- "$source_dir" >/dev/null 2>&1 || status=1
          else
            echo "failure_stage=cleanup"
            status=1
          fi
          if [[ "$status" != 0 ]]; then
            echo "prerequisite_cleanup_failed" >&2
            exit 1
          fi
