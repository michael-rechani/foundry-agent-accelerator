name: Check isolated private Foundry prerequisites

on:
  workflow_dispatch:
    inputs:
      user_agent:
        description: Non-secret invocation-only user agent from the Foundry azd guidance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-foundry-prerequisites
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    timeout-minutes: 10
    runs-on: [self-hosted, linux, lab-runner]
    environment: terraform-state
    permissions:
      contents: read
    env:
      PATH: /usr/local/bin:/usr/bin:/bin
      BASH_ENV: /dev/null
      ENV: /dev/null
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse unverified shared-runner execution
        run: |
          echo "failure_stage=supervision_unverified"
          echo "foundry_prerequisites_check_failed" >&2
          exit 1
