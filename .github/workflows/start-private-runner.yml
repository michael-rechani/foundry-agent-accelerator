name: Start private runner

# Dispatch from protected main after privately reviewing the existing VM's ARM ID.
# Input is its lowercase SHA-256 fingerprint: lowercase the full ID, UTF-8, no newline.
# Never submit the ID itself; this public repository exposes dispatch inputs.
# One-shot authorization: only run number 1, attempt 1 may authenticate or start.
# A failed/cancelled first run consumes this authorization; do not retry.
# Uses the existing lab-deploy principal (which also has Lab/ACR permissions);
# this job deliberately does not exercise those broader permissions.
# Starting the VM incurs compute cost until its existing idle shutdown runs.
# The smoke job proves only the named registration ran, not both registrations.
on:
  workflow_dispatch:
    inputs:
      reviewed_vm_sha256:
        description: Lowercase SHA-256 of the reviewed lowercased VM ARM ID (no newline)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: start-private-runner
  cancel-in-progress: false

jobs:
  start-runner:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: lab-deploy
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      LAB_RUNNER_VM: ${{ vars.LAB_RUNNER_VM }}
      LAB_RUNNER_RESOURCE_GROUP: ${{ vars.LAB_RUNNER_RESOURCE_GROUP }}
      REVIEWED_VM_SHA256: ${{ inputs.reviewed_vm_sha256 }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"
    steps:
      - name: Validate target, authenticate and start only the reviewed VM
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$RUN_NUMBER" == "1" && "$RUN_ATTEMPT" == "1" ]] || fail "One-shot authorization consumed; a new reviewed authorization is required."
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          [[ "$AZURE_SUBSCRIPTION_ID" =~ ^${uuid}$ ]] || fail "Invalid configured subscription ID."
          [[ "$AZURE_CLIENT_ID" =~ ^${uuid}$ ]] || fail "Invalid configured client ID."
          [[ "$AZURE_TENANT_ID" =~ ^${uuid}$ ]] || fail "Invalid configured tenant ID."
          [[ "$LAB_RUNNER_RESOURCE_GROUP" =~ ^[A-Za-z0-9_-][A-Za-z0-9_.-]{0,89}$ ]] || fail "Invalid configured resource group."
          [[ "$LAB_RUNNER_VM" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || fail "Invalid configured VM name."
          [[ "$REVIEWED_VM_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid reviewed VM fingerprint."
          expected_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$LAB_RUNNER_RESOURCE_GROUP/providers/Microsoft.Compute/virtualMachines/$LAB_RUNNER_VM"
          expected_sha256="$(printf '%s' "${expected_id,,}" | sha256sum)"
          expected_sha256="${expected_sha256%% *}"
          [[ "$REVIEWED_VM_SHA256" == "$expected_sha256" ]] || fail "Reviewed fingerprint differs from the configured target."
          for value in "$AZURE_SUBSCRIPTION_ID" "$LAB_RUNNER_RESOURCE_GROUP" "$LAB_RUNNER_VM" \
            "$expected_id" "${expected_id,,}" "$AZURE_CLIENT_ID" "$AZURE_TENANT_ID"; do
            echo "::add-mask::$value"
          done

          token="$(curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -er '.value | select(type == "string" and length > 0)')" || fail "OIDC token request failed."
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" --allow-no-subscriptions --output none || fail "Azure authentication failed."
          unset token
          az account set --subscription "$AZURE_SUBSCRIPTION_ID" || fail "Azure subscription selection failed."

          actual_id="$(az vm show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$LAB_RUNNER_RESOURCE_GROUP" --name "$LAB_RUNNER_VM" --query id --output tsv)" || fail "Azure VM identity read failed."
          [[ "${actual_id,,}" == "${expected_id,,}" ]] || fail "Azure VM ID differs from the configured and reviewed target."
          echo "::add-mask::$actual_id"
          power_state() {
            az vm get-instance-view --ids "$actual_id" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" --output tsv
          }
          state="$(power_state)" || fail "Azure VM power-state read failed."
          case "$state" in
            PowerState/running) ;;
            PowerState/stopped|PowerState/deallocated)
              az vm start --ids "$actual_id" --no-wait --output none || fail "Azure VM start failed." ;;
            PowerState/starting) ;;
            *) fail "VM power state is missing or not safe to start." ;;
          esac
          deadline=$((SECONDS + 300))
          until [[ "$state" == "PowerState/running" ]]; do
            (( SECONDS < deadline )) || fail "VM did not become running within five minutes."
            sleep 10
            state="$(power_state)" || fail "Azure VM power-state confirmation failed."
            case "$state" in
              PowerState/running|PowerState/starting|PowerState/stopped|PowerState/deallocated) ;;
              *) fail "VM entered an unexpected or missing power state." ;;
            esac
          done
          echo "Private runner VM confirmed running." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: start-runner
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    timeout-minutes: 2
    runs-on: [self-hosted, linux, lab-runner]
    permissions: {}
    steps:
      - name: Report the registration that executed this job
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner registration: %s\n' "$RUNNER_NAME"
          printf 'Runner registration: %s\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
