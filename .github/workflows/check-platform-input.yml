name: Temporary public dependency closure test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Test synthetic dependency closure failures
        run: python3 -m unittest discover -s .github/scripts -p test_platform_dependency_closure.py -v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e5d20db25519657bc9205e8436641f958066c48
          path: reviewed-source
          persist-credentials: false
      - name: Resolve public dependencies without a backend or credentials
        run: python3 .github/scripts/platform_dependency_closure.py capture "$RUNNER_TEMP/public-closure" --source reviewed-source/terraform
      - name: Report public resolved dependency graph
        run: |
          python3 -c 'import json, os; from pathlib import Path; m=json.loads((Path(os.environ["RUNNER_TEMP"])/"public-closure"/"manifest.json").read_bytes()); print(json.dumps({k:m[k] for k in ("source_sha", "terraform", "platform", "providers", "modules")}, indent=2)); print("Artifact records:", len(m["files"]))'
      - name: Reinstall and load schemas from offline verified packages
        run: |
          sudo unshare --net -- /usr/sbin/runuser -u "$(id -un)" -- /usr/bin/python3 "$PWD/.github/scripts/platform_dependency_closure.py" verify "$RUNNER_TEMP/public-closure" --terraform "$(command -v terraform)" --manifest-sha256 "$(sha256sum "$RUNNER_TEMP/public-closure/manifest.json" | cut -d ' ' -f 1)"
      - name: Reject altered captured packages and modules before execution
        env:
          PUBLIC_CLOSURE_TEST_BUNDLE: ${{ runner.temp }}/public-closure
        run: python3 -m unittest discover -s .github/scripts -p test_platform_dependency_closure.py -v
      - name: Preserve modes in transport and verify archive round trip
        run: |
          tar -czf "$RUNNER_TEMP/public-closure.tar.gz" -C "$RUNNER_TEMP" public-closure
          mkdir "$RUNNER_TEMP/closure-transport-check"
          tar -xzf "$RUNNER_TEMP/public-closure.tar.gz" -C "$RUNNER_TEMP/closure-transport-check"
          sudo unshare --net -- /usr/sbin/runuser -u "$(id -un)" -- /usr/bin/python3 "$PWD/.github/scripts/platform_dependency_closure.py" verify "$RUNNER_TEMP/closure-transport-check/public-closure" --terraform "$(command -v terraform)" --manifest-sha256 "$(sha256sum "$RUNNER_TEMP/public-closure/manifest.json" | cut -d ' ' -f 1)"
          sha256sum "$RUNNER_TEMP/public-closure.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: generated-public-closure-not-reviewed
          path: ${{ runner.temp }}/public-closure.tar.gz
          include-hidden-files: true
          retention-days: 3