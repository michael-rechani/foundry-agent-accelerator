name: Temporary public diagnostic overlay regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Existing and added synthetic regressions
        run: |
          sudo unshare --net -- /usr/sbin/runuser -u "$(id -un)" -- /usr/bin/env PATH="$PATH" /usr/bin/python3 -m unittest discover -s .github/scripts -p test_check_platform_router_plan.py -v
          python3 -m unittest discover -s .github/scripts -p test_platform_router_overlay.py -v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 446b078df12c9a08daec7bc5e9f0b5a57d8d7a5d
          path: reviewed-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0aca16abe9a2527a238b3702fcacefacb627ebf1
          path: public-closure-helper
          persist-credentials: false
      - name: Capture untrusted public module and provider test fixture
        run: python3 public-closure-helper/.github/scripts/platform_dependency_closure.py capture "$RUNNER_TEMP/public-overlay-fixture" --source reviewed-source/terraform
      - name: Actual exact-root overlay test with external networking disabled
        run: |
          sudo unshare --net -- /usr/sbin/runuser -u "$(id -un)" -- /usr/bin/env PUBLIC_OVERLAY_BUNDLE="$RUNNER_TEMP/public-overlay-fixture" OVERLAY_TERRAFORM="$(command -v terraform)" /usr/bin/python3 -m unittest discover -s .github/scripts -p test_platform_router_overlay.py -v
