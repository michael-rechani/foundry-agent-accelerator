name: Offline existing-agent promotion tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/michael-rechani-candidate-existing-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned deployment SDK
        run: python -m pip install -r hosted-agents/review-coordinator-agent/requirements-deploy.txt
      - name: Run offline deployment tests
        working-directory: hosted-agents
        run: python -m unittest -v test_candidate_smoke test_deployment test_deployment_sdk
