name: Temporary public Git-metadata-free closure derivation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Hostile synthetic archives in disposable hosted trees
        run: python3 -m unittest discover -s .github/scripts -p test_extract_platform_dependencies.py -v
      - name: Metadata-free synthetic derivation fixtures
        run: python3 -m unittest discover -s .github/scripts -p test_derive_gitless_dependencies.py -v
      - name: Download exact temporary public observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/michael-rechani/foundry-agent-accelerator/actions/artifacts/13588508507/zip > "$RUNNER_TEMP/extraction-public.zip"
          printf '%s  %s\n' a6620be72b125b4860cd13c7edb5644bd5e51ba89d65477e23ec533925a46838 "$RUNNER_TEMP/extraction-public.zip" | sha256sum --check
      - name: Verify known ZIP then invoke bounded tar.gz extractor
        run: |
          python3 - <<'PY'
          import hashlib, os, sys, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          import extract_platform_dependencies as extractor
          base = Path(os.environ['RUNNER_TEMP'])
          data = base / 'extraction-public.zip'
          if data.stat().st_size > 200_000_000 or hashlib.sha256(data.read_bytes()).hexdigest() != 'a6620be72b125b4860cd13c7edb5644bd5e51ba89d65477e23ec533925a46838':
              raise RuntimeError('Selected public ZIP bytes mismatch')
          archive = base / 'extraction-public.tar.gz'
          with zipfile.ZipFile(data) as source:
              files = source.infolist()
              if len(files) != 1 or files[0].filename != 'public-closure.tar.gz' or files[0].file_size > 200_000_000:
                  raise RuntimeError('Known ZIP transport shape mismatch')
              with source.open(files[0]) as stream, archive.open('xb') as target:
                  count = 0
                  while chunk := stream.read(65536):
                      count += len(chunk)
                      if count > 200_000_000:
                          raise RuntimeError('ZIP member size exceeded')
                      target.write(chunk)
          parent = Path(tempfile.mkdtemp(prefix='public-extraction-', dir=base))
          parent.chmod(0o700)
          root = extractor.extract(archive, '7afd7b7630954d34b9a83876369058eec6500cef0ddb4deac8b2d37872fa0e55', parent, 'verified')
          (base / 'extracted-root-path').write_text(str(root))
          print('Recorded GNU tar.gz extracted with bounded parser; archive identity is observed, not approved.')
          PY
      - name: Compare original and derived schemas, graph and validate without network
        run: |
          root="$(cat "$RUNNER_TEMP/extracted-root-path")"
          parent="$(mktemp -d "$RUNNER_TEMP/gitless-parent-XXXXXXXX")"
          chmod 700 "$parent"
          sudo unshare --net -- /usr/sbin/runuser -u "$(id -un)" -- /usr/bin/env PATH="$PATH" GITLESS_ORIGINAL="$root" GITLESS_PARENT="$parent" GITLESS_TERRAFORM="$(command -v terraform)" /usr/bin/python3 "$PWD/.github/scripts/check_gitless_public_fixture.py"
