name: Offline candidate smoke tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/michael-rechani-candidate-smoke-offline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deployment SDK
        run: python -m pip install -r hosted-agents/review-coordinator-agent/requirements-deploy.txt
      - name: Run offline deployment tests
        working-directory: hosted-agents
        run: python -m unittest -v test_candidate_smoke test_deployment test_deployment_sdk
