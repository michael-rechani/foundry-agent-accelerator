name: Temporary fictional snapshot integrity tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Stdlib fictional snapshots only; no elevated setup or services
        run: python3 -m unittest discover -s .github/scripts -p test_snapshot_integrity_guard.py -v
