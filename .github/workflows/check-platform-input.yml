name: Temporary synthetic denial Ruff compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Focused repository Ruff with missing-module-gated install
        run: |
          interpreter=''
          for candidate in /opt/hostedtoolcache/Python/3.14.*/x64/bin/python3; do
            if [ -x "$candidate" ]; then interpreter="$candidate"; break; fi
          done
          test -n "$interpreter"
          "$interpreter" --version
          env -i PATH="$PATH" LANG=C.UTF-8 "$interpreter" -c 'import os; assert os.geteuid() != 0'
          files=(.github/scripts/reconcile_runner_state.py .github/scripts/test_reconcile_runner_state.py)
          set +e
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONNOUSERSITE=1 "$interpreter" -m ruff check --config ruff.toml "${files[@]}" > "$RUNNER_TEMP/ruff-first.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ruff-first.txt"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if ! grep -Eq '^.*: No module named ruff$' "$RUNNER_TEMP/ruff-first.txt"; then exit "$status"; fi
          test "$(cat .github/requirements-validation.txt)" = 'ruff==0.17.3'
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 PYTHONNOUSERSITE=1 "$interpreter" -m pip install --disable-pip-version-check --no-input --no-cache-dir --target "$RUNNER_TEMP/ruff-pinned" 'ruff==0.17.3'
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONPATH="$RUNNER_TEMP/ruff-pinned" "$interpreter" -m ruff --version
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONPATH="$RUNNER_TEMP/ruff-pinned" "$interpreter" -m ruff check --config ruff.toml "${files[@]}"
      - name: Focused mocked denial tests
        run: |
          interpreter=''
          for candidate in /opt/hostedtoolcache/Python/3.14.*/x64/bin/python3; do
            if [ -x "$candidate" ]; then interpreter="$candidate"; break; fi
          done
          test -n "$interpreter"
          if command -v terraform >/dev/null; then exit 1; fi
          env -i PATH="$PATH" LANG=C.UTF-8 PYTHONNOUSERSITE=1 "$interpreter" -m unittest discover -s .github/scripts -p test_reconcile_runner_state.py -v
