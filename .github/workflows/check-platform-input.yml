name: Temporary public module provenance observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 446b078df12c9a08daec7bc5e9f0b5a57d8d7a5d
          path: reviewed-source
          persist-credentials: false
      - name: Capture public dependency observations
        run: python3 .github/scripts/platform_dependency_closure.py capture "$RUNNER_TEMP/public-closure" --source reviewed-source/terraform
      - name: Compare module cache to exact public Git trees
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import urllib.request

          modules = [
              ("ai_foundry", "avm-ptn-aiml-ai-foundry", "0.11.3", "terraform-azurerm-avm-ptn-aiml-ai-foundry", "6879cada3e3ef47207c584d2c7fd94cb91f186c7"),
              ("ai_foundry.avm_utl_regions", "avm-utl-regions", "0.12.0", "terraform-azurerm-avm-utl-regions", "e9d62409c6fcc5554b60dd79cd60f55b344ad2f0"),
              ("ai_foundry.cosmosdb", "avm-res-documentdb-databaseaccount", "0.10.0", "terraform-azurerm-avm-res-documentdb-databaseaccount", "fd939385fa4a4309d436dcab0958bf7aa20a01af"),
              ("ai_foundry.key_vault", "avm-res-keyvault-vault", "0.10.2", "terraform-azurerm-avm-res-keyvault-vault", "3735ca49887857467f3030ad72fd43705e1eb387"),
              ("ai_foundry.storage_account", "avm-res-storage-storageaccount", "0.6.9", "terraform-azurerm-avm-res-storage-storageaccount", "83ceb978776db0da45a0166a92996d13654b8bd2"),
              ("api_management", "avm-res-apimanagement-service", "0.9.0", "terraform-azurerm-avm-res-apimanagement-service", "1bb1067ee2e5ce085f84b099fac4159e57fba15f"),
              ("naming", "naming", "0.4.4", "terraform-azurerm-naming", "2359079c7a07a447a7ce25958de3c203aeb7e0ab"),
          ]
          bundle = Path(os.environ["RUNNER_TEMP"]) / "public-closure" / "root" / ".terraform" / "modules"
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with tempfile.TemporaryDirectory() as temporary:
              env = {"PATH": os.environ["PATH"], "HOME": temporary, "GIT_CONFIG_NOSYSTEM": "1",
                     "GIT_CONFIG_GLOBAL": os.devnull, "GIT_TERMINAL_PROMPT": "0", "LANG": "C.UTF-8"}
              def git(*args):
                  result = subprocess.run(["git", *args], env=env, stdout=subprocess.PIPE,
                                          stderr=subprocess.PIPE, check=False)
                  if result.returncode:
                      raise SystemExit("Public Git object retrieval failed; output withheld.")
                  return result.stdout
              for cache_name, registry_name, version, repo_name, commit in modules:
                  uri = f"https://registry.terraform.io/v1/modules/Azure/{registry_name}/azurerm/{version}/download"
                  request = urllib.request.Request(uri)
                  with opener.open(request, timeout=30) as response:
                      source = response.headers.get("X-Terraform-Get")
                  expected_source = f"git::https://github.com/Azure/{repo_name}?ref={commit}"
                  if source != expected_source:
                      raise SystemExit(f"{cache_name}: registry reference differs from observed commit.")
                  database = Path(temporary) / cache_name
                  git("init", "--quiet", str(database))
                  git("-C", str(database), "fetch", "--quiet", "--depth=1",
                      f"https://github.com/Azure/{repo_name}.git", commit)
                  tree = git("-C", str(database), "ls-tree", "-r", "-z", "--full-tree", commit)
                  expected = {}
                  for item in tree.split(b"\0"):
                      if not item:
                          continue
                      meta, raw_name = item.split(b"\t", 1)
                      mode, kind, oid = meta.decode("ascii").split()
                      if kind != "blob" or mode not in ("100644", "100755"):
                          raise SystemExit(f"{cache_name}: unsupported Git tree entry.")
                      name = raw_name.decode("utf-8")
                      expected[name] = (mode, oid)
                  actual = {}
                  metadata_files = 0
                  cache = bundle / cache_name
                  for path in cache.rglob("*"):
                      if path.is_symlink():
                          raise SystemExit(f"{cache_name}: cache contains a link.")
                      if not path.is_file():
                          continue
                      relative = path.relative_to(cache).as_posix()
                      if relative.startswith(".git/"):
                          metadata_files += 1
                          continue
                      content = path.read_bytes()
                      oid = hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()
                      mode = "100755" if path.stat().st_mode & 0o111 else "100644"
                      actual[relative] = (mode, oid)
                  missing = set(expected) - set(actual)
                  extra = set(actual) - set(expected)
                  changed = {key for key in set(actual) & set(expected) if actual[key] != expected[key]}
                  print(f"{cache_name}: tracked={len(expected)} missing={len(missing)} extra={len(extra)} changed={len(changed)} git_metadata_files={metadata_files}", flush=True)
                  if not expected or missing or extra or changed:
                      raise SystemExit(f"{cache_name}: captured module differs from its referenced Git tree.")
          print("All seven public module caches match tracked Git trees; independent trust and rollout gates remain open.")
          PY
