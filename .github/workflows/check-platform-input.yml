name: Offline retained-candidate regression tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/michael-rechani-candidate-existing-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Restore only missing pinned dependencies
        run: |
          python - <<'PY'
          import importlib.util
          import subprocess
          import sys
          for module, manifest in (("azure", "hosted-agents/review-coordinator-agent/requirements-deploy.txt"),
                                   ("ruff", ".github/requirements-validation.txt")):
              if importlib.util.find_spec(module) is None:
                  print("Missing dependency:", module, flush=True)
                  subprocess.run([sys.executable, "-m", "pip", "install", "-r", manifest], check=True)
          PY
      - name: Run focused regression tests
        working-directory: hosted-agents
        run: python -m unittest -v test_candidate_smoke test_deployment test_deployment_sdk
      - name: Check repository Ruff rules
        run: python -m ruff check hosted-agents/deployment.py hosted-agents/test_candidate_smoke.py hosted-agents/test_deployment.py hosted-agents/test_deployment_sdk.py
