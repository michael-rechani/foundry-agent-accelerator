name: Temporary synthetic ledger scaling
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Discover available Python and Ruff without installing tools
        run: |
          python3 --version
          if command -v python3.14 >/dev/null; then python3.14 --version; fi
          if command -v ruff >/dev/null; then ruff --version; else echo 'Ruff unavailable; no install authorized'; fi
      - name: Measure synthetic inventory scaling without credentials
        run: env -i PATH="$PATH" LANG=C.UTF-8 PYTHONNOUSERSITE=1 python3 -m unittest discover -s .github/scripts -p test_ledger_cleanup_scaling.py -v
      - name: Focused synthetic dependency regression tests
        run: env -i PATH="$PATH" LANG=C.UTF-8 PYTHONNOUSERSITE=1 python3 -m unittest discover -s .github/scripts -p 'test_*dependencies.py' -v
      - name: Existing Ruff configuration if available
        run: |
          if command -v ruff >/dev/null; then
            env -i PATH="$PATH" LANG=C.UTF-8 ruff check --config ruff.toml .github/scripts/extract_platform_dependencies.py .github/scripts/test_extract_platform_dependencies.py .github/scripts/derive_gitless_dependencies.py .github/scripts/test_derive_gitless_dependencies.py .github/scripts/test_ledger_cleanup_scaling.py
          else
            echo 'Ruff check not run; unavailable without package installation'
          fi
