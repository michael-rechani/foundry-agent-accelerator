name: Temporary frontend lockfile refresh

on:
  push:
    branches: [michael-rechani-repo-maintenance-fixes]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    container: node:24.21.0-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    defaults:
      run:
        working-directory: workbench/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --no-audit --no-fund "lucide-react@^1.48.0"
      - run: npm install --no-audit --no-fund -D "@vitejs/plugin-react@^6.1.1" "prettier@^3.9.9" "vite@^8.3.1" "typescript@~7.0.2" "@types/node@^24.13.6"
      - run: npm update --no-audit --no-fund
      - name: Report TypeScript build
        continue-on-error: true
        run: npx tsc -b && npx tsc --version
      - name: Report formatting
        continue-on-error: true
        run: npx prettier --check .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-lock
          path: |
            workbench/frontend/package.json
            workbench/frontend/package-lock.json
