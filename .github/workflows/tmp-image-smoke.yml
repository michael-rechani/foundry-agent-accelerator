name: Temporary image smoke test

on:
  push:
    branches: [michael-rechani-repo-maintenance-fixes]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Lab image
        run: docker build -t lab:test -f workbench/Dockerfile workbench
      - name: Report runtime versions
        run: |
          docker run --rm lab:test python --version
          docker run --rm lab:test python -m pip list --format=freeze | grep -Ei '^(azure-ai-projects|openai|uvicorn|fastapi)=='
      - name: Start the container and check its endpoints
        run: |
          docker run -d --name lab -p 8080:8080 lab:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          echo; curl -fsS http://localhost:8080/healthz
          echo; curl -fsS http://localhost:8080/api/config | head -c 600
          echo; curl -fsS -o /dev/null -w "index: %{http_code} %{content_type}\n" http://localhost:8080/
          docker logs lab 2>&1 | tail -20
      - name: Install and import the hosted runtime on the same Python 3.14 image
        run: |
          image=$(grep -m1 '^FROM python' workbench/Dockerfile | awk '{print $2}')
          for dir in hosted-agents/basic-responses-agent hosted-agents/case-review-agent hosted-agents/application-review-agent hosted-agents/review-coordinator-agent workbench/agent_runtime; do
            echo "::group::$dir"
            docker run --rm -v "$PWD/$dir:/src:ro" "$image" sh -ec '
              pip install -q --root-user-action=ignore -r /src/requirements.txt
              pip check
              python -c "from agent_framework import Agent; from agent_framework.foundry import FoundryChatClient; from agent_framework_foundry_hosting import ResponsesHostServer; import agent_framework_foundry_hosting, sys; print(sys.version.split()[0], \"imports ok\")"
            '
            echo "::endgroup::"
          done
