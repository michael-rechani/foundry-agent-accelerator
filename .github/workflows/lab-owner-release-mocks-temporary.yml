name: Lab owner release mocks (temporary)

on:
  push:
    branches: [michael-rechani-enable-owner-lab-release]

permissions:
  contents: read

jobs:
  mocked-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Lab release contract and rollout simulations
        run: python3 .github/scripts/test_lab_image_release.py -v
