name: Test AzAPI routing scanner
on:
  push:
    branches: [michael-rechani-azapi-registration-guard]
permissions:
  contents: read
jobs:
  scanner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run synthetic provider-routing scanner tests only
        working-directory: .github/scripts
        run: >-
          python3 -m unittest -v
          test_azapi_registration_overlay.AzapiRegistrationOverlayTests.test_hcl_provider_routing_is_rejected_conservatively
          test_azapi_registration_overlay.AzapiRegistrationOverlayTests.test_tf_json_provider_routing_is_rejected
          test_azapi_registration_overlay.AzapiRegistrationOverlayTests.test_malformed_and_duplicate_tf_json_fail_closed
          test_azapi_registration_overlay.AzapiRegistrationOverlayTests.test_safe_hcl_and_tf_json_without_provider_routing_pass