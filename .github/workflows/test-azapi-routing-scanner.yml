name: Temporary AzAPI routing scanner tests

on:
  push:
    branches:
      - michael-rechani-azapi-registration-guard

permissions:
  contents: read

jobs:
  scanner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python -m pip install -r .github/requirements-validation.txt
      - run: python -m ruff check .github/scripts/test_azapi_registration_overlay.py
      - run: python -m unittest discover -s .github/scripts -p 'test_azapi_registration_overlay.py' -v