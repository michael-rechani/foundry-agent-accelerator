name: Temporary public closure observation
on:
  push:
    branches: [michael-rechani-public-closure-observation-20261107]
permissions:
  contents: read
concurrency:
  group: public-closure-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Require non-root and install repository Ruff
        run: |
          test "$(id -u)" != 0
          python -m pip install --quiet -r .github/requirements-validation.txt
      - name: Repository Ruff and synthetic observation tests only
        run: |
          python -m ruff check .github/scripts/observe_public_closure.py .github/scripts/public_closure_transport.py .github/scripts/test_observe_public_closure.py .github/scripts/test_azapi_registration_overlay.py
          python -m unittest discover -s .github/scripts -p 'test_observe_public_closure.py'
          python -m unittest discover -s .github/scripts -p 'test_azapi_registration_overlay.py'
