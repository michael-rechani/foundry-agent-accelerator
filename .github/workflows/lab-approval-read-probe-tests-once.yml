name: Lab approval read probe synthetic tests

on:
  push:
    branches: [michael-rechani-lab-image-release-safeguards]

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 .github/scripts/test_probe_lab_approval_reads.py -v
