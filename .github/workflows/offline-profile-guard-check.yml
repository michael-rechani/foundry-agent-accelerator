name: Offline profiled PowerShell guard check

on:
  push:
    branches: [copilot/profile-promotion-integration-20261107]
    paths: [.github/workflows/offline-profile-guard-check.yml]

permissions:
  contents: read

jobs:
  powershell:
    if: github.ref == 'refs/heads/copilot/profile-promotion-integration-20261107' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check fictional PowerShell guards only
        shell: bash
        run: pwsh -NoLogo -NoProfile -File workbench/test-deploy.ps1 -PowerShellOnly
