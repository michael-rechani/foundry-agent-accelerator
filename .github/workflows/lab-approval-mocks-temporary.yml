name: Lab approval verifier mocks (temporary)

on:
  push:
    branches:
      - michael-rechani-lab-image-release-safeguards

permissions:
  contents: read

jobs:
  mocked-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run mocked approval evidence tests
        run: python3 .github/scripts/test_check_lab_image_approval.py -v
