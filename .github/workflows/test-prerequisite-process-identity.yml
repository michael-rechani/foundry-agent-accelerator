name: Test disabled prerequisite launcher offline
on:
  push:
    branches: [michael-rechani-prerequisite-process-identity]
permissions:
  contents: read
jobs:
  synthetic-process-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Focused Ruff with repository configuration
        run: |
          if ! python -m ruff --version >/dev/null 2>&1; then
            python -m pip install -r .github/requirements-validation.txt
          fi
          python -m ruff check .github/scripts/check_foundry_prerequisites.py .github/scripts/test_check_foundry_prerequisites.py
      - name: Owned synthetic children and mocked lifecycle only
        working-directory: .github/scripts
        run: |
          test "$(id -u)" -ne 0
          python -m unittest test_check_foundry_prerequisites.ProcessTests test_check_foundry_prerequisites.ProcessRetentionTests test_check_foundry_prerequisites.CleanupTests test_check_foundry_prerequisites.FailureStageTests -v