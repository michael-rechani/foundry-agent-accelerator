name: Reviewed release and private verification integration

on:
  push:
    branches:
      - copilot/release-verification-integration-20261107

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run fictional release and verification checks
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          /usr/bin/env -i \
            "PATH=/usr/bin:/bin" \
            "HOME=$RUNNER_TEMP" \
            "LANG=C" \
            "PYTHONPATH=$GITHUB_WORKSPACE/workbench:$GITHUB_WORKSPACE/.github/scripts" \
            "RUNNER_TRACKING_ID=${RUNNER_TRACKING_ID:-}" \
            /usr/bin/bash --noprofile --norc -e <<'SH'
          python3 -m unittest -v test_verify_private test_profile_verification_contract test_release_verification_contract
          python3 -m unittest discover -s .github/scripts -p test_reviewed_agent_release.py
          python3 -m unittest discover -s hosted-agents -p test_deployment.py
          python3 -m unittest discover -s hosted-agents/review-coordinator-agent -p test_profiles.py
          SH
