name: Prerequisite shared runner safety synthetic
on:
  push:
    branches: [michael-rechani-prerequisite-shared-runner-safety]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Require unprivileged execution
        run: test "$(id -u)" -ne 0
      - name: Focused fictional safety and existing helper tests
        working-directory: .github/scripts
        run: >-
          python -m unittest -v
          test_check_foundry_prerequisites.ProcessTests
          test_check_foundry_prerequisites.CleanupTests
          test_check_foundry_prerequisites.FailureStageTests
          test_check_foundry_prerequisites.WorkflowTests
          test_check_foundry_prerequisites.PrerequisiteTests
