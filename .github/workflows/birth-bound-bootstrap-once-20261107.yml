name: Birth-bound bootstrap synthetic once
on:
  push:
    branches: ["michael-rechani-birth-bound-bootstrap-20261107"]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Nonroot primitive evidence
        run: |
          id
          test "$(id -u)" -ne 0
          python -c "import os,sys,socket,signal; print(sys.version); print('CLOSEFROM',hasattr(os,'POSIX_SPAWN_CLOSEFROM')); print('pidfd',hasattr(os,'pidfd_open'),hasattr(signal,'pidfd_send_signal')); print('credentials',hasattr(socket,'SCM_CREDENTIALS'))"
      - name: Focused synthetic tests
        working-directory: .github/scripts
        run: >-
          python -m unittest -v test_birth_bound_bootstrap test_owned_process
          test_check_foundry_prerequisites.ProcessTests
          test_check_foundry_prerequisites.ProcessRetentionTests
          test_check_foundry_prerequisites.CleanupTests
          test_check_foundry_prerequisites.FailureStageTests
      - name: Ruff only when module missing
        run: |
          if python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('ruff') else 1)"; then
            python -c "import importlib.metadata; assert importlib.metadata.version('ruff') == '0.17.3'"
          else
            echo "Observed missing ruff module; installing existing pinned validation requirements"
            python -m pip install -r .github/requirements-validation.txt
          fi
          python -m ruff check --config ruff.toml .github/scripts/birth_bound_bootstrap.py .github/scripts/test_birth_bound_bootstrap.py .github/scripts/owned_process.py .github/scripts/test_owned_process.py .github/scripts/check_foundry_prerequisites.py .github/scripts/test_check_foundry_prerequisites.py
