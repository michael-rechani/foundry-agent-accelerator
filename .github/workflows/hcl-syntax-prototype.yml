name: Temporary synthetic HCL fuzz investigation
on:
  push:
    branches: [michael-rechani-hcl-syntax-prototype-20261107]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.8"
          cache: false
      - name: Restore dependencies only after a genuine missing-module failure
        working-directory: .github/offline-hcl-prototype
        env:
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          test "$(id -u)" != 0
          go version
          probe="$(mktemp "$RUNNER_TEMP/hcl-probe.XXXXXX")"
          trap 'rm -f -- "$probe"' EXIT
          if GOPROXY=off go test -mod=readonly -run='^$' ./... >"$probe" 2>&1; then
            cat "$probe"
          elif grep -q 'module lookup disabled by GOPROXY=off' "$probe"; then
            cat "$probe"
            go mod download
          else
            cat "$probe"
            exit 1
          fi
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Synthetic analyzer tests and vet
        working-directory: .github/offline-hcl-prototype
        env:
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: "off"
        run: |
          go test -mod=readonly -count=1 -cover -v ./...
          go vet -mod=readonly ./...
      - name: Repeated fuzz targets with bounded coordinator debug
        working-directory: .github/offline-hcl-prototype
        env:
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: "off"
        run: |
          failed=0
          for round in 1 2 3; do
            for target in FuzzAnalyze FuzzNoopControl; do
              echo "=== round=$round target=$target ==="
              if GODEBUG=fuzzdebug=1 go test -mod=readonly -run='^$' -fuzz="^${target}$" -fuzztime=10s -parallel=2 2>&1 |
                awk '/ DEBUG / { n++; lines[n % 30] = $0; next }
                     { print; fflush() }
                     END {
                       print "=== coordinator_debug_count=" n " last_at_most=30 ==="
                       first = n > 30 ? n - 29 : 1
                       for (i = first; i <= n; i++) print lines[i % 30]
                     }'; then
                echo "=== round=$round target=$target status=pass ==="
              else
                status=$?
                echo "=== round=$round target=$target status=fail exit=$status ==="
                failed=1
              fi
            done
          done
          exit "$failed"
