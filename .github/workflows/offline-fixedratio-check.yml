name: Offline fixed-ratio safety checks
on:
  push:
    branches: [michael-rechani-candidate-fixedratio-guard]
    paths: [.github/workflows/offline-fixedratio-check.yml]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Check existing SDK dependencies
        run: |
          python -c 'import azure.ai.projects, azure.identity, requests, openai; from importlib.metadata import version; assert version("azure-ai-projects") == "2.6.1" and version("azure-identity") == "1.27.0" and version("openai") == "3.41.0"' || python -m pip install -r hosted-agents/review-coordinator-agent/requirements-deploy.txt
          python -c 'import azure.ai.projects, azure.identity, requests, openai; from importlib.metadata import version; assert version("azure-ai-projects") == "2.6.1" and version("azure-identity") == "1.27.0" and version("openai") == "3.41.0"'
      - name: Check existing Ruff dependency
        run: |
          python -m ruff --version || python -m pip install -r .github/requirements-validation.txt
          python -c 'from importlib.metadata import version; assert version("ruff") == "0.17.3"'
      - name: Run fictional tests and repository Ruff checks
        run: |
          set +e
          cd hosted-agents
          python - <<'PY'
          import sys, unittest
          names = ['test_candidate_smoke', 'test_deployment', 'test_deployment_sdk']
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('Unexpected skipped tests:', result.skipped)
          sys.exit(not result.wasSuccessful() or bool(result.skipped))
          PY
          test_status=$?
          cd ..
          python -m ruff check hosted-agents/deployment.py hosted-agents/test_candidate_smoke.py hosted-agents/test_deployment.py hosted-agents/test_deployment_sdk.py
          ruff_status=$?
          if [ "$test_status" -ne 0 ] || [ "$ruff_status" -ne 0 ]; then exit 1; fi
