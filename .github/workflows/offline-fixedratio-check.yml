name: Offline fixed-ratio SDK probe
on:
  push:
    branches: [michael-rechani-candidate-fixedratio-guard]
    paths: [.github/workflows/offline-fixedratio-check.yml]
permissions:
  contents: read
jobs:
  sdk-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Check existing SDK dependencies
        run: |
          python -c 'import azure.ai.projects, azure.identity, requests, openai; from importlib.metadata import version; assert version("azure-ai-projects") == "2.6.1" and version("azure-identity") == "1.27.0" and version("openai") == "3.41.0"' || python -m pip install -r hosted-agents/review-coordinator-agent/requirements-deploy.txt
      - name: Inspect fictional SDK GET and PATCH wire models
        run: |
          python - <<'PY'
          import io, json, time
          from unittest.mock import patch
          import requests
          from azure.ai.projects import AIProjectClient
          from azure.ai.projects.models import AgentEndpointConfig, FixedRatioVersionSelectionRule, VersionSelector
          from azure.core.credentials import AccessToken
          class Credential:
              def get_token(self, *args, **kwargs):
                  return AccessToken('fictional', int(time.time()) + 3600)
          incoming = [
              {'type':'FixedRatio','agent_version':'1','traffic_percentage':100},
              {'type':'Unsupported','agent_version':'1','traffic_percentage':100},
              {'agent_version':'1','traffic_percentage':100},
              {'type':None,'agent_version':'1','traffic_percentage':100},
              {'type':True,'agent_version':'1','traffic_percentage':100},
              {'type':'FixedRatio','agent_version':'1'},
              {'type':'FixedRatio','agent_version':'1','traffic_percentage':'100'},
          ]
          calls=[]
          def respond(adapter, request, **kwargs):
              calls.append(request.method)
              response=requests.Response(); response.status_code=200; response.headers['Content-Type']='application/json'; response.request=request
              if request.method=='GET':
                  rule=incoming[len(calls)-1]
                  body={'name':'fictional-agent','state':'enabled','agent_endpoint':{'version_selector':{'version_selection_rules':[rule]},'protocol_configuration':{'responses':{}}}}
              else:
                  print('PATCH_WIRE', request.body)
                  body={}
              response._content=json.dumps(body).encode(); response.raw=io.BytesIO(response._content)
              return response
          with patch.object(requests.adapters.HTTPAdapter,'send',respond):
              with AIProjectClient(endpoint='https://fictional.services.ai.azure.com/api/projects/demo', credential=Credential(), retry_total=0) as client:
                  for wire in incoming:
                      try:
                          model=client.agents.get(agent_name='fictional-agent')
                          rule=model.agent_endpoint.version_selector.version_selection_rules[0]
                          print('GET_WIRE',json.dumps(wire),'MODEL',type(rule).__name__,'MAPPING',json.dumps(dict(rule),default=str),'TYPE_ATTR',repr(getattr(rule,'type',None)),'PERCENT_ATTR',repr(getattr(rule,'traffic_percentage',None)))
                      except Exception as exc:
                          print('GET_ERROR',json.dumps(wire),type(exc).__name__,str(exc))
                  endpoint=AgentEndpointConfig(version_selector=VersionSelector(version_selection_rules=[FixedRatioVersionSelectionRule(agent_version='1',traffic_percentage=100)]))
                  assert endpoint.as_dict()['version_selector']['version_selection_rules'][0] == {'type':'FixedRatio','agent_version':'1','traffic_percentage':100}
                  client.agents.update_details(agent_name='fictional-agent',agent_endpoint=endpoint)
          assert calls == ['GET']*len(incoming)+['PATCH']
          PY
