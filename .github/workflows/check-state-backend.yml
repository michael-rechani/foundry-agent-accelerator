name: Check private Terraform state access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-state-access
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: [self-hosted, linux, lab-runner]
    environment: terraform-state
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      TF_STATE_ACCOUNT: ${{ vars.TF_STATE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      TF_STATE_PRIVATE_ENDPOINT: ${{ vars.TF_STATE_PRIVATE_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check private DNS, OIDC blob access and a disposable blob lease
        run: python3 .github/scripts/check_state_backend.py
