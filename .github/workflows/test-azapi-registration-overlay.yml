name: Test AzAPI registration overlay

on:
  push:
    branches: [michael-rechani-azapi-registration-guard]

permissions:
  contents: read

jobs:
  offline-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michael-rechani/foundry-agent-accelerator
          ref: dc5bd967324d38d693c049b6e75d8f275fc6b3fb
          path: closure-tool
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Capture the public module and provider closure
        run: >-
          python3 closure-tool/.github/scripts/platform_dependency_closure.py
          capture "$RUNNER_TEMP/public-overlay-bundle"
          --source "$GITHUB_WORKSPACE/terraform" --terraform terraform
      - name: Prepare public Python container for network-disabled checks
        run: docker pull python:3.13-slim
      - name: Run focused overlay regressions and actual-root validation without a network
        env:
          PUBLIC_OVERLAY_BUNDLE: ${{ runner.temp }}/public-overlay-bundle
          OVERLAY_TERRAFORM: terraform
        run: |
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.13-slim)
          terraform_bin=$(readlink -f "$(command -v terraform)")
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/public-overlay-bundle,dst=/bundle,readonly" \
            --mount "type=bind,src=$terraform_bin,dst=/usr/local/bin/terraform,readonly" \
            --env HOME=/tmp/home --env PYTHONDONTWRITEBYTECODE=1 --env LANG=C.UTF-8 \
            --env OVERLAY_TERRAFORM=/usr/local/bin/terraform \
            --entrypoint /bin/sh "$image" -ec '
              mkdir -p "$HOME"
              cd /repo
              python3 -m unittest discover -s .github/scripts -p test_platform_router_overlay.py -v
              PUBLIC_OVERLAY_BUNDLE=/bundle python3 .github/scripts/test_azapi_registration_overlay.py -v
            '