name: Lab approval read capability

on:
  push:
    branches: [michael-rechani-lab-image-release-safeguards]

permissions:
  contents: read
  deployments: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read capability only for inert copilot target
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: >-
          python3 -c
          'import os; from probe_lab_approval_reads import run_probe;
          raise SystemExit(run_probe(os.environ["PROBE_TOKEN"]))'
