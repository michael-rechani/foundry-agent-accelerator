name: Test private scratch prerequisite

on:
  push:
    branches: [michael-rechani-scratch-prerequisite]

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Linux scratch boundary tests
        run: python3 -m unittest discover -s .github/scripts -p test_private_scratch.py -v