name: Temporary bounded AST synthetic tests
on:
  push:
    branches: [michael-rechani-hcl-bounded-walk-20261107]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.8"
          cache: false
      - name: Offline validation before conditional dependency restoration
        working-directory: .github/offline-hcl-prototype
        env:
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          test "$(id -u)" != 0
          probe="$(mktemp "$RUNNER_TEMP/hcl-probe.XXXXXX")"
          trap 'rm -f -- "$probe"' EXIT
          if GOPROXY=off go test -mod=readonly -run='^$' ./... >"$probe" 2>&1; then
            cat "$probe"
          elif grep -q 'module lookup disabled by GOPROXY=off' "$probe"; then
            cat "$probe"
            go mod download
          else
            cat "$probe"
            exit 1
          fi
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Actual analyzer synthetic tests and vet
        working-directory: .github/offline-hcl-prototype
        env:
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: "off"
        run: |
          go test -mod=readonly -count=1 -cover -v ./...
          go vet -mod=readonly ./...
      - name: Original synthetic fuzz coverage without a pipeline
        working-directory: .github/offline-hcl-prototype
        env:
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: "off"
        run: go test -mod=readonly -run='^$' -fuzz='^FuzzAnalyze$' -fuzztime=10s -parallel=2
