# Secret scan for every commit. CI runs `gitleaks git` against the full history.
[extend]
useDefault = true

# The tests were removed in #443, but full-history scans still read their commits.
[[allowlists]]
description = "Synthetic Key Vault secret versions in historical offline Terraform tests"
condition = "AND"
paths = ['''^terraform/tests/[^/]+\.tftest\.hcl$''']
regexes = ['''^0123456789abcdef0123456789abcdef$''']

# Case ids such as "workflow-coordinator-grounded-access" next to a SHA-256 digest
# match the generic API key rule. The digests are public content fingerprints.
[[allowlists]]
description = "SHA-256 context digests in the scorecard context baseline"
condition = "AND"
paths = ['''^evaluations/evidence/context-baseline\.json$''']
regexes = ['''^[0-9a-f]{64}$''']
